services:
  app:
    image: webapia/visa2026:${APP_IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-8081}:8080"
    volumes:
      - app_dataprotection_keys_dev:/home/app/.aspnet/DataProtection-Keys
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026_dev};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - DEVEXPRESS_LICENSEKEY=${DEVEXPRESS_LICENSEKEY}
      - FORCE_XAF_DB_UPDATE=${FORCE_XAF_DB_UPDATE:-}
      - ASPNETCORE_ENVIRONMENT=Development
      - Logging__LogLevel__Default=Debug
      - Logging__LogLevel__Microsoft=Information
      - Logging__LogLevel__DevExpress=Information
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-updater:
    profiles:
      - tools
    image: webapia/visa2026-importer:${IMPORTER_IMAGE_TAG:-latest}
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Development
      - API_BASE_URL=http://app:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026_dev};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - TargetUrl=http://app:8080
    depends_on:
      - app

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-visa2026_dev}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${DB_NAME:-visa2026_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  manual:
    profiles:
      - manual
    image: nginx:1.27-alpine
    ports:
      - "${MANUAL_PORT:-8083}:80"
    volumes:
      - ./user-manual/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MANUAL_SITE_ROOT:-./deploy/manual/site}:/usr/share/nginx/html/manual:ro
      - ${MANUAL_MEDIA_ROOT:-./deploy/manual/media}:/usr/share/nginx/html/manual-media:ro
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_dev:
  app_dataprotection_keys_dev: