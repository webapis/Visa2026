# VISA2014 → Visa2026 — migration status tracker
#
# Human dashboard: STATUS.md (same folder)
#
# Update rules:
#   - Set lastUpdated + updatedBy on every edit.
#   - Entity discovery/import flags: canonical in order.yaml — mirror summary only in entity-inventory.yaml.
#   - Add/close issues here; do not bury blockers only in dossier notes.
#   - When an issue is resolved, set status: resolved + resolvedAt; keep the row for history.
#   - When a workstream completes, set status: done + completedAt.
#
# Status values:
#   workstreams: not_started | in_progress | blocked | done
#   issues: open | in_progress | resolved | deferred | wont_fix

