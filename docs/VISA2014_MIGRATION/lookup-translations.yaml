# Lookup value translation — same meaning, different representation in VISA2014 vs Visa2026
#
# STRATEGY: Do NOT import legacy lookup tables. Target Visa2026 catalogs are authoritative.
#           See LOOKUP_RESOLUTION_STRATEGY.md for workflow, gaps, duplicates, normalization.
#
# Person discovery (2026-06-20): Gender + Country samples below.
# MaritalStatus: approved 2026-06-21 — Status int 0–5 → Visa2026 Code (not StatusL narrative).
# Relationship: approved 2026-06-21 — RelativeAsL → NameTm; Mother + BrotherInLaw added to target catalog.
# ProjectContract: approved 2026-06-21 — experimental remap all legacy codes → tenant GT-15 (Gap Insaat → Calik Enerji pilot).
# Lookup review gate: complete person-wave in lookup-comparisons/lookup-review-queue.yaml before Person importConfirmed.

version: 1

catalogs:
  - targetCatalog: Gender
    targetMatchProperty: Code
    legacy:
      storage: legacy_lookup_table
      table: dbo.Gender
      column: TypeOfGenderL
      valueKind: string
      sampleQuery: |
        SELECT DISTINCT g.TypeOfGenderL, g.TypeOfGender, COUNT(*) AS cnt
        FROM dbo.Person p
        INNER JOIN dbo.Gender g ON p.Gender = g.Oid
        WHERE p.GCRecord IS NULL
        GROUP BY g.TypeOfGenderL, g.TypeOfGender;
    values:
      - legacy: Erkek
        target: Erkek
        notes: Legacy TypeOfGender=0
      - legacy: Ayal
        target: Aýal
        notes: Legacy TypeOfGender=1; Visa2026 Code uses Turkmen Aýal (LookupCatalogMatchHelper folds ASCII)
    unmappedPolicy: allow_null
    unmappedDefault: null

  - targetCatalog: Country
    targetMatchProperty: Code
    legacy:
      storage: legacy_lookup_table
      table: dbo.Country
      column: NameOfCountryL
      valueKind: string
      sampleQuery: |
        -- DISTINCT codes used on active Person (BirthCountry, ForeignAddressCountry, Passport.Citizenship)
        WITH hits AS (
          SELECT LTRIM(RTRIM(c.NameOfCountryL)) AS legacy_code
          FROM dbo.Person p
          INNER JOIN dbo.Country c ON p.BirthCountry = c.Oid
          WHERE p.GCRecord IS NULL
          UNION
          SELECT LTRIM(RTRIM(c.NameOfCountryL))
          FROM dbo.Person p
          INNER JOIN dbo.Country c ON p.ForeignAddressCountry = c.Oid
          WHERE p.GCRecord IS NULL
          UNION
          SELECT LTRIM(RTRIM(c.NameOfCountryL))
          FROM dbo.Person p
          INNER JOIN dbo.Passport pp ON pp.Person = p.Oid AND pp.GCRecord IS NULL
          INNER JOIN dbo.Country c ON pp.Citizenship = c.Oid
          WHERE p.GCRecord IS NULL
        )
        SELECT legacy_code, COUNT(*) AS cnt FROM hits GROUP BY legacy_code ORDER BY cnt DESC;
    audit:
      completedAt: 2026-06-20
      scope: Person
      distinctLegacyValuesUsed: 64
      allMappedToTarget: true
      unmapped: []
      legacyCountryTableActiveRows: 1037
      legacyDuplicateOidsPerCode: "7-8 Oids per code common — resolve by NameOfCountryL string, not legacy Oid"
      topCodesByHits: "TUR 4349, JPN 1318, IND 370, DEU 345, ITA 283"
    values:
