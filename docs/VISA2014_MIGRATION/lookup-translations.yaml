      - Ýolöten
      - Farap
      - Sarahs
      - Garabogaz
      - Etrek
    unmappedPolicy: use_default
    unmappedDefault: Ýok
    nullFkPolicy: use_default
    nullFkDefault: Ýok
    allBitsFalsePolicy: use_default
