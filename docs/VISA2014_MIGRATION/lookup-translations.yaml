      Re-audit DISTINCT from transactional FKs when Application / other BOs add Country lookups.
      Legacy dbo.Country has many duplicate Oids per code — importer resolves by translated Code, not legacy Oid.

  - targetCatalog: MaritalStatus
    targetMatchProperty: Code
    legacy:
      storage: legacy_lookup_table
      table: dbo.MaritalStatus
      column: Status
      valueKind: int_as_string
      sampleQuery: |
        SELECT ms.Status, COUNT(*) AS cnt
        FROM dbo.Person p
        INNER JOIN dbo.MaritalStatus ms ON p.MaritalStatus = ms.Oid
        WHERE p.GCRecord IS NULL
        GROUP BY ms.Status
        ORDER BY ms.Status;
    audit:
      completedAt: 2026-06-21
      scope: Person
      distinctLegacyValuesUsed: 6
      allMappedToTarget: true
      unmapped: []
      approvedDecision: "Status=0 → Öýlenen (Married); StatusL narrative not imported as catalog"
      personWithFkCount: 2569
      legacyLookupTableActiveRows: 1965
      comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/MaritalStatus.md
    values:
      - legacy: "0"
        target: Öýlenen
        notes: Status=0 family narrative rows (1543+ Person rows) — map to Married; StatusL → VisaApplicationFamilyMembersText
      - legacy: "1"
        target: Sallah
        notes: Legacy Status=1 — Single
      - legacy: "2"
        target: Öýlenen
        notes: Legacy Status=2 — Married (husband line)
      - legacy: "3"
        target: Öýlenen
        notes: Legacy Status=3 — Married (spouse/child lines)
      - legacy: "4"
        target: Aýrylşan
        notes: Legacy Status=4 — Divorced
      - legacy: "5"
        target: Çaga
        notes: Legacy Status=5 — Minor
    unmappedPolicy: allow_null
    unmappedDefault: null
    notes: |
      Legacy is NOT a simple string catalog. Person FK → MaritalStatus row with Status int (0–5) + StatusL narrative.
      Approved 2026-06-21: map Status int (as string key) → Visa2026 MaritalStatus.Code.
      Do NOT import 1,965 narrative lookup rows — StatusL copied to VisaApplicationFamilyMembersText in preview/import.
      See lookup-comparisons/MaritalStatus.md and lookup-review-queue.yaml.

