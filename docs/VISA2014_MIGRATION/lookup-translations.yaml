      - legacy: Ayal doganynyn adamsy (giyewisi)
        target: aýal doganyň adamsy (giýewisi)
        notes: Brother-in-law — added to Visa2026 relationship.json 2026-06-21
    unmappedPolicy: allow_null
    unmappedDefault: null
    notes: |
      Match RelativeAsL via LookupCatalogMatchHelper normalization (ASCII Turkmen fold).
      Do NOT use RelativeAs int alone (codes 3 and 6 are ambiguous in legacy table).
      Only 159/2569 Person rows have FamilyMemberRelation FK (family members).

