  - targetCatalog: BorderZoneName
    targetMatchProperty: NameTm
    legacy:
      storage: legacy_bit_matrix
      table: dbo.BorderZoneForVisa
      join: Visa.BorderZone = BorderZoneForVisa.Oid
      valueKind: bit_matrix
      bitColumns:
        - Daşoguz
        - Tagtabazar
        - Serhetabat
        - Ýolöten
        - Farap
        - Sarahs
        - Garabogaz
        - Etrek
      legacyHelperSource: VISA2014.Module/BusinessObjects/Helper.cs Get_BZ_*
      sampleQuery: |
        SELECT
          SUM(CASE WHEN ISNULL(bz.[Daşoguz],0)=1 THEN 1 ELSE 0 END) AS Dasoguz,
          SUM(CASE WHEN ISNULL(bz.Tagtabazar,0)=1 THEN 1 ELSE 0 END) AS Tagtabazar,
          SUM(CASE WHEN ISNULL(bz.Serhetabat,0)=1 THEN 1 ELSE 0 END) AS Serhetabat,
          SUM(CASE WHEN ISNULL(bz.[Ýolöten],0)=1 THEN 1 ELSE 0 END) AS Yoloten,
          SUM(CASE WHEN ISNULL(bz.Farap,0)=1 THEN 1 ELSE 0 END) AS Farap,
          SUM(CASE WHEN ISNULL(bz.Garabogaz,0)=1 THEN 1 ELSE 0 END) AS Garabogaz,
          SUM(CASE WHEN ISNULL(bz.Sarahs,0)=1 THEN 1 ELSE 0 END) AS Sarahs,
          SUM(CASE WHEN ISNULL(bz.Etrek,0)=1 THEN 1 ELSE 0 END) AS Etrek,
          COUNT(*) AS visa_rows
        FROM dbo.Visa v
        INNER JOIN dbo.BorderZoneForVisa bz ON v.BorderZone = bz.Oid
        WHERE v.GCRecord IS NULL AND bz.GCRecord IS NULL;
    audit:
      completedAt: 2026-06-21
      scope: Visa
      distinctBitPatternsOnVisa: 18
      allMappedToTarget: true
      comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/BorderZoneName.md
      catalogRowsAdded:
        - Daşoguz şäher
        - Tagtabazar etrap
        - Serhetabat etrap
        - Ýolöten etrap
        - Farap etrap
        - Etrek etrap
    values:
      - legacy: Daşoguz
        target: Daşoguz şäher
      - legacy: Tagtabazar
        target: Tagtabazar etrap
      - legacy: Serhetabat
        target: Serhetabat etrap
      - legacy: Ýolöten
        target: Ýolöten etrap
      - legacy: Farap
        target: Farap etrap
      - legacy: Sarahs
        target: Sarahs etraby
        notes: Legacy Helper typo Sarags etrap; 0 Çalik visa rows
      - legacy: Garabogaz
        target: Garabogaz şäheri
        notes: Legacy Helper Garabogaz şäher → catalog şäheri
      - legacy: Etrek
        target: Etrek etrap
    outputFormat: comma_separated
    bitOrder:
