  - targetCatalog: ApplicationType
    targetMatchProperty: Name
    legacy:
      storage: composite_derived
      table: dbo.Application
      valueKind: composite
      compositeColumns:
        - ForEmployee
        - ForFamilyMember
        - ApplicationTypeForEmployee.TypeOfApplicationForEmployeeID
        - ApplicationTypeForFamilyMember.TypeOfApplicationForFamilyMemberID
        - IsInvitationWithWorkPermit.InvitationAndWorkPermitRequired
        - IsWizaWithWorkPermit.WizaAndWorkPermitRequired
        - ChangeInformation
      compositeKeyFormat: "{category}:{subtypeId}:{invWp}:{wizaWp}:{changeInfo}"
      categoryRule: "ForEmployee=1 → E; ForFamilyMember=1 → F"
      sampleQuery: |
        SELECT CASE WHEN a.ForEmployee=1 THEN 'E' WHEN a.ForFamilyMember=1 THEN 'F' END AS category,
               COALESCE(ate.TypeOfApplicationForEmployeeID, atfm.TypeOfApplicationForFamilyMemberID) AS subtype_id,
               iwp.InvitationAndWorkPermitRequired, wwp.WizaAndWorkPermitRequired,
               a.ChangeInformation, COUNT(*) AS cnt
        FROM dbo.Application a
        LEFT JOIN dbo.ApplicationTypeForEmployee ate ON ate.Oid = a.ApplicationTypeForEmployee
        LEFT JOIN dbo.ApplicationTypeForFamilyMember atfm ON atfm.Oid = a.ApplicationTypeForFamilyMember
        LEFT JOIN dbo.IsInvitationWithWorkPermit iwp ON iwp.Oid = a.IsInvitationWithWorkPermit
        LEFT JOIN dbo.IsWizaWithWorkPermit wwp ON wwp.Oid = a.IsWizaWithWorkPermit
        WHERE a.GCRecord IS NULL
        GROUP BY CASE WHEN a.ForEmployee=1 THEN 'E' WHEN a.ForFamilyMember=1 THEN 'F' END,
                 COALESCE(ate.TypeOfApplicationForEmployeeID, atfm.TypeOfApplicationForFamilyMemberID),
                 iwp.InvitationAndWorkPermitRequired, wwp.WizaAndWorkPermitRequired, a.ChangeInformation
        ORDER BY cnt DESC;
