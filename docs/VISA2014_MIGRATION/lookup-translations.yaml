      Re-audit DISTINCT from transactional FKs when Application / other BOs add Country lookups.
      Legacy dbo.Country has many duplicate Oids per code — importer resolves by translated Code, not legacy Oid.

  - targetCatalog: MaritalStatus
    targetMatchProperty: Code
    legacy:
      storage: legacy_lookup_table
      table: dbo.MaritalStatus
      column: Status
      valueKind: int_as_string
      sampleQuery: |
        SELECT ms.Status, COUNT(*) AS cnt
        FROM dbo.Person p
        INNER JOIN dbo.MaritalStatus ms ON p.MaritalStatus = ms.Oid
        WHERE p.GCRecord IS NULL
        GROUP BY ms.Status
        ORDER BY ms.Status;
    audit:
      completedAt: 2026-06-21
      scope: Person
      distinctLegacyValuesUsed: 6
      allMappedToTarget: true
      unmapped: []
      approvedDecision: "Status=0 → Öýlenen (Married); StatusL narrative not imported as catalog"
      personWithFkCount: 2569
      legacyLookupTableActiveRows: 1965
      comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/MaritalStatus.md
    values:
      - legacy: "0"
        target: Öýlenen
        notes: Status=0 family narrative rows (1543+ Person rows) — map to Married; StatusL → VisaApplicationFamilyMembersText
      - legacy: "1"
        target: Sallah
        notes: Legacy Status=1 — Single
      - legacy: "2"
        target: Öýlenen
        notes: Legacy Status=2 — Married (husband line)
      - legacy: "3"
        target: Öýlenen
        notes: Legacy Status=3 — Married (spouse/child lines)
      - legacy: "4"
        target: Aýrylşan
        notes: Legacy Status=4 — Divorced
      - legacy: "5"
        target: Çaga
        notes: Legacy Status=5 — Minor
    unmappedPolicy: allow_null
    unmappedDefault: null
    notes: |
      Legacy is NOT a simple string catalog. Person FK → MaritalStatus row with Status int (0–5) + StatusL narrative.
      Approved 2026-06-21: map Status int (as string key) → Visa2026 MaritalStatus.Code.
      Do NOT import 1,965 narrative lookup rows — StatusL copied to VisaApplicationFamilyMembersText in preview/import.
      See lookup-comparisons/MaritalStatus.md and lookup-review-queue.yaml.

  - targetCatalog: Relationship
    targetMatchProperty: NameTm
    legacy:
      storage: legacy_lookup_table
      table: dbo.Relation
      column: RelativeAsL
      valueKind: string
      sampleQuery: |
        SELECT LTRIM(RTRIM(r.RelativeAsL)) AS RelativeAsL, COUNT(*) AS cnt
        FROM dbo.Person p
        INNER JOIN dbo.Relation r ON p.FamilyMemberRelation = r.Oid
        WHERE p.GCRecord IS NULL AND r.GCRecord IS NULL
        GROUP BY LTRIM(RTRIM(r.RelativeAsL))
        ORDER BY cnt DESC;
    audit:
      completedAt: 2026-06-21
      scope: Person
      distinctLegacyValuesUsed: 7
      allMappedToTarget: true
      unmapped: []
      personWithFkCount: 159
      comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/Relationship.md
      catalogRowsAdded: [Mother, BrotherInLaw]
    values:
      - legacy: ayaly
        target: aýaly
      - legacy: ogly
        target: ogly
      - legacy: Ogly
        target: ogly
        notes: Case variant of Son
      - legacy: gyzy
        target: gyzy
      - legacy: kakasy
        target: kakasy
      - legacy: ayal dogany
        target: aýal dogany
      - legacy: ejesi
        target: ejesi
        notes: Mother — added to Visa2026 relationship.json 2026-06-21
      - legacy: Ayal doganynyn adamsy (giyewisi)
        target: aýal doganyň adamsy (giýewisi)
        notes: Brother-in-law — added to Visa2026 relationship.json 2026-06-21
    unmappedPolicy: allow_null
    unmappedDefault: null
    notes: |
      Match RelativeAsL via LookupCatalogMatchHelper normalization (ASCII Turkmen fold).
      Do NOT use RelativeAs int alone (codes 3 and 6 are ambiguous in legacy table).
      Only 159/2569 Person rows have FamilyMemberRelation FK (family members).

  - targetCatalog: ProjectContract
    targetMatchProperty: Code
    legacy:
      storage: legacy_lookup_table
      table: dbo.Contract
      column: NumberOfContract
      valueKind: string
      sampleQuery: |
        SELECT LTRIM(RTRIM(c.NumberOfContract)) AS NumberOfContract, COUNT(*) AS cnt
        FROM dbo.Person p
        INNER JOIN dbo.Contract c ON p.Contract = c.Oid
        WHERE p.GCRecord IS NULL AND c.GCRecord IS NULL
        GROUP BY LTRIM(RTRIM(c.NumberOfContract))
        ORDER BY cnt DESC;
    audit:
      completedAt: 2026-06-21
      scope: Person
      distinctLegacyValuesUsed: 14
      distinctLegacyValuesPersonUnionApplication: 15
      allMappedToTarget: true
      approvedDecision: "Experimental pilot — all legacy Gap Insaat codes → tenant GT-15 (Calik Enerji seed)"
      comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/ProjectContract.md
      canonicalTargetCode: GT-15
      canonicalTargetNameTm: "GT-15 — (2 ylalaşyk: türkmenenergo > energetika)"
    values:
