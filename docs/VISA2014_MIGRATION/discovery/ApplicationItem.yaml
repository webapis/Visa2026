    Person-scoped children without legacy FK (Education, MedicalRecord, Salary, WorkDuty, InvitationItem): resolve from Person id-map current-items at import.
    Workflow flags (VisaIssued, InvitationItemIsIssued, …): partial map from Cancelled/Rejected/IsComplete — full PersonState enum deferred.
    Dedupe: 925 groups same (Application, Person) — canonical lowest Oid; skip_row duplicates (1,221 extra rows).
