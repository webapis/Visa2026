  notes: |
    STRUCTURAL SPLIT (critical):
      Legacy VISA2014 has NO WorkPermit header — dbo.WorkPermit is a flat per-employee row (IWorkPermit).
      Visa2026 splits into WorkPermit (letter/header) + WorkPermitItem (per employee line).
      Import must SYNTHESIZE headers from dbo.WorkPermitLetter, then attach items (see WorkPermitItem.yaml).

    VISA2015 stats (full backup, GCRecord IS NULL):
      WorkPermit rows: 6363 (schema-snapshot listed 5317 — recount on calik attach).
      Distinct WorkPermitLetter: 398 (~16 items/letter avg, max 129).
      WorkPermitLetter columns: Number, Date, Company.
      Only 2 WorkPermit rows lack WorkPermitLetter FK.

  HEADER SYNTHESIS (proposed):
      Source: DISTINCT dbo.WorkPermitLetter (join WorkPermit for company filter if needed).
      WorkPermit.WorkPermitNumber ← WorkPermitLetter.Number
      WorkPermit.IssuedDate ← WorkPermitLetter.Date (maps to column StartDate in EF)
      WorkPermit.Application ← optional; resolve after Application import:
        Mode A: from items on same letter — PersonInApplication.Application via WorkPermit.ProcessNumber
        Mode B: leave null for standalone permits (535 legacy rows have no ProcessNumber)
      id-map: legacy WorkPermitLetter.Oid → Visa2026 WorkPermit.ID

    DEFER / FILE WAVE:
      WorkPermitDocument / WorkPermitImage — no dbo scan table found; letter scans TBD (audit / FileData).
      WorkPermitStateEnum on legacy row → no header equivalent; map Cancelled to WorkPermitItem.IsCancelled.

    PREREQUISITES:
      Application + ApplicationItem discovery/import recommended before linking WorkPermit.Application.
      Pilot may import headers + items with Application = null, backfill Application FK later.

