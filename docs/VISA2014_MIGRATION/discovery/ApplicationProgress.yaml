visa2026:
  boPath: Visa2026.Module/BusinessObjects/ApplicationProgress.cs
  docPath: docs/APPLICATION_PROGRESS_APPROVAL_AND_CONTRACT_DEPTH.md
  odataExposed: true

mapping:
  fieldMapFile: Visa2026.DataImporter/legacy/visa2014/field-maps/ApplicationProgress.yaml
  tableMappingId: application-progress-synthetic
  cardinality: many_progress_rows_per_application
  upsertKeys:
    - _syntheticStepKey
  lookupDependencies:
    - ApplicationState
    - ApplicationLocation
  lookupAuditStatus:
    ApplicationState: target_catalog_by_code_2026-06-29
    ApplicationLocation: target_catalog_by_code_2026-06-29
  duplicateGroups: 0
  legacyOnlyCount: 8
  targetOnlyCount: 1
  mismatchCount: 3
  blockedReason: null
  notes: |
    **Simple process (8,392 apps):** no DateForwardedToMonistery on Çalik — office → migration service from ProcessDate only.
    **Long process (3,845 apps):** ministry route — 3,822 with DateForwardedToMonistery; Contract FK on all long-process rows.
    **Synthesis tiers (active Application, GCRecord IS NULL):**
      office-only (no ministry fwd): 8,415 | at ministry: 88 | returned from ministry: 47 | process date set: 12,047
      MinConstruction leg: 273 | Cancelled: 306 | Rejected: 0 (header flag)
  synthesisStrategy:
    approved: true
    approvedAt: 2026-06-29
    approvedBy: developer
    maxMinistryLegsFromLegacy: 2
    simpleProcessSteps:
      - step: prepare
        when: always
        state: IS_BEING_PREPARED
        location: AT_OFFICE
        dateSource: IRegistration_Data.ManualApplicationDate
      - step: migration_started
        when: ProcessDate >= 2000-01-01 OR ProcessNumber non-empty
        state: PROCESS_STARTED
        location: AT_MIGRATION_SERVICE
        dateSource: day_after_prepare_or_prior_migration_step
      - step: migration_issued
        when: ProcessDate >= 2000-01-01 OR ProcessNumber non-empty
        state: PROCESS_ISSUED
        location: AT_MIGRATION_SERVICE
        dateSource: ProcessDate
        descriptionFields: [ProcessNumber]
    longProcessSteps:
      - step: prepare
        when: always
        state: IS_BEING_PREPARED
        location: AT_OFFICE
        dateSource: IRegistration_Data.ManualApplicationDate
      - step: ministry_forward
        when: DateForwardedToMonistery >= 2000-01-01
        state: 1_REVIEW_STARTED
        location: AT_THE_MINISTERY_1
        dateSource: DateForwardedToMonistery
      - step: ministry_return
        when: MinisteriesDocumentDate >= 2000-01-01 OR MinisteriesDocumentNumber non-empty
        state: 2_REVIEW_APPROVED
        location: AT_THE_MINISTERY_2
        dateSource: MinisteriesDocumentDate
        descriptionFields: [MinisteriesDocumentNumber]
        notes: Leg 1 approved (Türkmenenergo) has no doc — ministry from ApprovalLegProfile
      - step: ministry_2_forward
        when: DateForwardedToMinConstruction >= 2000-01-01 AND ProjectContract.MinistryLegs >= 3
        state: 3_REVIEW_STARTED
        location: AT_THE_MINISTERY_3
        dateSource: DateForwardedToMinConstruction
        descriptionFields: [DocNumberForwardedToMinConstruction]
      - step: migration_started
        when: ProcessDate >= 2000-01-01 OR ProcessNumber non-empty OR ministry legs complete (not cancelled/rejected)
        state: PROCESS_STARTED
        location: AT_MIGRATION_SERVICE
        dateSource: day_after_last_ministry_step_or_prior_step
      - step: migration_issued
        when: ProcessDate >= 2000-01-01 OR ProcessNumber non-empty
        state: PROCESS_ISSUED
        location: AT_MIGRATION_SERVICE
        dateSource: ProcessDate
        descriptionFields: [ProcessNumber]
    terminalOverrides:
      - when: Cancelled = 1
        state: PROCESS_CANCELLED
        location: AT_OFFICE
        dateSource: last_non_null_progress_date_or_ApplicationDate
        priority: after_synthesis
      - when: Rejected = 1 OR full RejectionItem coverage
        state: PROCESS_REJECTED
        location: AT_MIGRATION_SERVICE
        dateSource: |
          Prefer max ApplicationResult.IssuedDate (Result=Rejection) when full coverage;
          else Application.ProcessDate; else prior step / ApplicationDate.
        priority: after_synthesis
        notes: |
          Full coverage = PersonInApplication count > 0 AND equals total PersonInInvitation
          under ApplicationResult Result=Rejection for the same Application (maps to
          ApplicationItems.Count == sum(Rejection.RejectionItems) after import).
          OR with rare header Application.Rejected=1. Partial coverage does not reject.
    skipParentApplication:
      - parent ApplicationType E:44/E:55 skipped at header import — no progress rows
    initializerConflict: |
      ApplicationProgressInitializer seeds IS_BEING_PREPARED on Application create unless SuppressInitialProgress=true (OData migration).
      Bulk import: Visa2014ApplicationODataImporter sets SuppressInitialProgress; cleanup CLI removes legacy seeds; ApplicationProgress OData removes seeds before POST.
    validationConflict: |
      ApplicationProgressCommitValidationController enforces transition graph on save.
      Historical import may need ordered POST, migration bypass flag, or server-side import endpoint — TBD at implementation.
    ministryLetterFile: defer_file_wave
    estimatedRows:
      simpleMin: 8392
      simpleMax: 16784
      longMin: 3845
      longMax: 15380
      note: 1–2 rows typical simple; up to 5 long-process with construction leg

