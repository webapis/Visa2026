# Lookup review queue — gate before main BO importConfirmed
#
# Human dashboard: lookup-comparisons/README.md
# Layer 3 output: lookup-translations.yaml
#
# Gate rules:
#   personWaveComplete   → required before Person importConfirmed (order.yaml)
#   applicationWaveComplete → required before Application importConfirmed / discovery close
#
# Do NOT import legacy lookup tables. Translate DISTINCT values used on transactional FKs only.

version: 1
lastUpdated: 2026-06-21
updatedBy: developer — Person importConfirmed

gateRules:
  personWaveComplete:
    requiredBefore: Person.importConfirmed
    blocksUntil: all personWave entries have auditStatus approved | done
    currentStatus: complete
    remaining: []
    notes: |
      All person-wave lookups approved 2026-06-21.
      ProjectContract uses experimental GT-15 remap (Gap Insaat legacy → Calik Enerji tenant).
      Person importConfirmed true 2026-06-21.

  applicationWaveComplete:
    requiredBefore: Application.importConfirmed
    blocksUntil: all applicationWave entries have auditStatus approved | done
    currentStatus: not_started
    notes: Application discovery may start in parallel; importConfirmed blocked until wave complete

waves:
  personWave:
    label: Person-domain lookup catalogs
    entries:
      - catalog: Gender
        legacyTable: dbo.Gender
        legacyColumn: TypeOfGenderL
        usedBy: [Person]
        auditStatus: done
        comparisonDoc: null
        lookupTranslations: docs/VISA2014_MIGRATION/lookup-translations.yaml
        blocksImportUntilApproved: false
        notes: 2 values mapped (Ayal→Aýal, Erkek→Erkek)

      - catalog: Country
        legacyTable: dbo.Country
        legacyColumn: NameOfCountryL
        usedBy: [Person]
        auditStatus: done
        comparisonDoc: null
        lookupTranslations: docs/VISA2014_MIGRATION/lookup-translations.yaml
        blocksImportUntilApproved: false
        notes: Person-scope 64 identity Code mappings (2026-06-20)

      - catalog: MaritalStatus
        legacyTable: dbo.MaritalStatus
        legacyColumn: Status
        usedBy: [Person]
        auditStatus: approved
        comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/MaritalStatus.md
        lookupTranslations: docs/VISA2014_MIGRATION/lookup-translations.yaml
        blocksImportUntilApproved: false
        approvedAt: 2026-06-21
        notes: |
          Status int 0–5 → Visa2026 Code; Status=0 → Öýlenen approved.
          StatusL narrative → VisaApplicationFamilyMembersText (not catalog).
          Legacy table: 2369 total / 1965 active rows; 2569 Person rows with FK.

      - catalog: Relationship
        legacyTable: dbo.Relation
        legacyColumn: RelativeAsL
        usedBy: [Person]
        auditStatus: approved
        comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/Relationship.md
        lookupTranslations: docs/VISA2014_MIGRATION/lookup-translations.yaml
        blocksImportUntilApproved: false
        approvedAt: 2026-06-21
        legacyStats:
          tableRowsAll: 54
          tableRowsActive: 12
          personFkHits: 159
          valuesMapped: 8
        notes: |
          Approved 2026-06-21: all 159 Person FK rows map via RelativeAsL → NameTm.
          Mother (ejesi) + BrotherInLaw added to Visa2026 relationship.json.

      - catalog: ProjectContract
        legacyTable: dbo.Contract
        legacyColumn: NumberOfContract
        usedBy: [Person, Application]
        auditStatus: approved
        comparisonDoc: docs/VISA2014_MIGRATION/lookup-comparisons/ProjectContract.md
        lookupTranslations: docs/VISA2014_MIGRATION/lookup-translations.yaml
        blocksImportUntilApproved: false
        approvedAt: 2026-06-21
        legacyStats:
          personFkHits: 2410
          transactionalDistinctCodes: 15
          targetRemap: GT-15
        notes: |
          Approved 2026-06-21: experimental pilot — all legacy codes → GT-15.
          Gap Insaat VISA2015 data on Calik Enerji tenant seed; not production contract fidelity.

