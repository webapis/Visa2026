# VISA2014 table → Visa2026 OData entity mapping
# Layer 1 — see docs/VISA2014_MIGRATION.md § Mapping protocol

version: 1

mappings:
  - id: person-main
    legacy:
      schema: dbo
      table: Person
      boClass: Person
      boPath: VISA2014.Module/DC/IPerson.cs
    target:
      odataEntity: Person
      boPath: Visa2026.Module/BusinessObjects/Person.cs
    relationship: primary_with_extension
    legacyTablesExtra:
      - schema: dbo
        table: Employee
        join: Employee.Oid = Person.Oid
        role: one_to_one_extension
      - schema: dbo
        table: Passport
        join: Passport.Person = Person.Oid AND Passport.GCRecord IS NULL
        role: child_for_scalar_coalesce
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Person.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Person.yaml
    status: mapped
    notes: |
      2,569 active Person rows. Passport import remains separate Visa2026 BO.
      Extract uses canonical passport per person for PersonalNumber and Nationality.

  - id: passport-main
    legacy:
      schema: dbo
      table: Passport
      boClass: Passport
      boPath: VISA2014.Module/DC/IPassport.cs
    target:
      odataEntity: Passport
      boPath: Visa2026.Module/BusinessObjects/Passport.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: PassportType
        join: PassportType.Oid = Passport.PassportType
        role: lookup_fk
      - schema: dbo
        table: Country
        join: Country.Oid = Passport.PassportIssuedCountry
        role: lookup_fk
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Passport.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Passport.yaml
    status: mapped
    notes: |
      3,684 active Passport rows on Çalik VISA2015; 3,241 persons; 353 multi-passport.
      Depends on Person id-map. PassportType + IssuedCountry layer-3 approved 2026-06-26.

  - id: visa-main
    legacy:
      schema: dbo
      table: Visa
      boClass: Visa
      boPath: VISA2014.Module/DC/IVisa.cs
    target:
      odataEntity: Visa
      boPath: Visa2026.Module/BusinessObjects/Visa.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: VisaType
        join: VisaType.Oid = Visa.VisaType
        role: lookup_fk
      - schema: dbo
        table: IVisaType_Data
        join: IVisaType_Data.Oid = VisaType.IVisaType_Data
        role: lookup_extension
      - schema: dbo
        table: VisaCategory
        join: VisaCategory.Oid = Visa.VisaCategory
        role: lookup_fk
      - schema: dbo
        table: VisaIssuedPlace
        join: VisaIssuedPlace.Oid = Visa.VisaIssuedPlace
        role: lookup_fk
      - schema: dbo
        table: BorderZoneForVisa
        join: BorderZoneForVisa.Oid = Visa.BorderZone
        role: border_zone_matrix
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Visa.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Visa.yaml
    status: mapped
    notes: |
      6,041 active Visa rows on Çalik VISA2015; 4,581 passports; 1,460 multi-visa.
      Depends on Passport id-map. Layer-3 audits pending (VisaType, VisaCategory, VisaIssuedPlace, BorderZoneName).

  - id: education-main
    legacy:
      schema: dbo
      table: Education
      boClass: Education
      boPath: VISA2014.Module/DC/IEducation.cs
    target:
      odataEntity: Education
      boPath: Visa2026.Module/BusinessObjects/Education.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: EducationLevel
        join: EducationLevel.Oid = Education.EducationLevel
        role: lookup_fk
      - schema: dbo
        table: EducationInstitution
        join: EducationInstitution.Oid = Education.EducationInstitution
        role: lookup_fk
      - schema: dbo
        table: Speciality
        join: Speciality.Oid = Education.Spcialty
        role: lookup_fk
      - schema: dbo
        table: Country
        join: Country.Oid = Education.EducationCountry
        role: lookup_fk
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Education.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Education.yaml
    status: mapped
    notes: |
      3,133 active Education rows; 3,109 persons; 5 multi-education. Depends on Person id-map.
      EducationLevel approved 2026-06-26; Institution + Specialty seeded calik-energi 2026-06-26. Import done.

  - id: employee-position-history-main
    legacy:
      schema: dbo
      table: WorkHistoryOfEmployee
      boClass: WorkHistoryOfEmployee
      boPath: VISA2014.Module/DC/IWorkHistoryOfEmployee.cs
    target:
      odataEntity: EmployeePositionHistory
      boPath: Visa2026.Module/BusinessObjects/EmployeePositionHistory.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: Position
        join: Position.Oid = WorkHistoryOfEmployee.Position
        role: lookup_fk
      - schema: dbo
        table: Department
        join: Department.Oid = WorkHistoryOfEmployee.Department
        role: lookup_fk
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/EmployeePositionHistory.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/EmployeePositionHistory.yaml
    status: mapped
    notes: |
      2,993 active WorkHistoryOfEmployee rows; Employee FK → Person. No legacy EndDate column.
      Position (1579 distinct) + Department (74 distinct) tenant catalog seeds pending before import.
      ActualPosition derived from same Position title (Visa2026-only BO).

  - id: employee-salary-main
    legacy:
      schema: dbo
      table: Employee
      boClass: Employee
    target:
      odataEntity: EmployeeSalary
      boPath: Visa2026.Module/BusinessObjects/EmployeeSalary.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: Salary
        join: Salary.Oid = Employee.Salary
        role: lookup_fk
      - schema: dbo
        table: WorkHistoryOfEmployee
        join: WorkHistoryOfEmployee.Employee = Employee.Oid
        role: derive_start_date
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/EmployeeSalary.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/EmployeeSalary.yaml
    status: mapped
    notes: |
      2,950 active employees (Employee ⋈ Person); one salary per employee via Salary.Detail lookup text.
      No legacy history or currency column — import as open EmployeeSalary row (EndDate null).

  - id: medical-record-spid-kepilnama
    legacy:
      schema: dbo
      table: IPersonn_SpidKepilnama
      boClass: IPerson
      boPath: VISA2014.Module/DC/IPerson.cs
    target:
      odataEntity: MedicalRecord
      boPath: Visa2026.Module/BusinessObjects/MedicalRecord.cs
    relationship: junction_to_file
    legacyTablesExtra:
      - schema: dbo
        table: Copy
        join: Copy.Oid = IPersonn_SpidKepilnama.ICopy_Implicit_IPersonn_SpidKepilnama_List_Link
        role: file_carrier
      - schema: dbo
        table: FileData
        join: FileData.Oid = Copy.CopyOfDocument
        role: blob_store
      - schema: dbo
        table: AuditedObjectWeakReference
        join: AuditedObjectWeakReference.GuidId IN (Copy.Oid, FileData.Oid)
        role: derive_issue_date
      - schema: dbo
        table: AuditDataItemPersistent
        join: AuditDataItemPersistent.AuditedObject = AuditedObjectWeakReference.Oid
        role: derive_issue_date
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/MedicalRecord.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/MedicalRecord.yaml
    status: mapped
    notes: |
      Spid kepilnama scans only — Person.SpidKepilnama → Copy → FileData.
      No legacy scalar medical fields; synthesize MedicalRecord per link (DocumentNumber "0",
      IssueDate from audit ObjectCreated, ValidityDuration Month3). Çalik: 2 links, 0 blobs.

  - id: address-of-residence-main
    legacy:
      schema: dbo
      table: AddressOfResidence
      boClass: AddressOfResidence
    target:
      odataEntity: AddressOfResidence
      boPath: Visa2026.Module/BusinessObjects/AddressOfResidence.cs
    relationship: primary
    legacyTablesExtra:
      - schema: dbo
        table: Address
        join: Address.Oid = AddressOfResidence.Address
        role: detail_fk
      - schema: dbo
        table: Region
        join: Region.Oid = Address.Region
        role: lookup_fk
      - schema: dbo
        table: ŞeherEtrap
        join: ŞeherEtrap.Oid = Address.ŞeherEtrap
        role: lookup_fk
      - schema: dbo
        table: DocumentOfAddress
        join: DocumentOfAddress.Oid = Address.DocumentOfAddress
        role: lookup_fk
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/AddressOfResidence.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/AddressOfResidence.yaml
    status: mapped
    notes: |
      4,083 active rows; Address detail holds Region, ŞeherEtrap, AddressLine, expiration.
      Type from DocumentOfAddress. Person id-map required. Lodging tenant catalog prerequisite.

  - id: application-main
    legacy:
      schema: dbo
      table: Application
      boClass: IApplication
      boPath: VISA2014.Module/DC/IApplication.cs
    target:
      odataEntity: Application
      boPath: Visa2026.Module/BusinessObjects/Application.cs
    relationship: primary_with_registration_extension
    legacyTablesExtra:
      - schema: dbo
        table: IRegistration_Data
        join: IRegistration_Data.Oid = Application.IRegistration_Data
        role: numbering_and_date_extension
      - schema: dbo
        table: SimpleProcessApplication
        join: SimpleProcessApplication.Oid = Application.Oid
        role: inheritance_discriminator
      - schema: dbo
        table: LongProcessApplication
        join: LongProcessApplication.Oid = Application.Oid
        role: inheritance_discriminator
      - schema: dbo
        table: ApplicationTypeForEmployee
        join: ApplicationTypeForEmployee.Oid = Application.ApplicationTypeForEmployee
        role: lookup_fk_derive_type
      - schema: dbo
        table: ApplicationTypeForFamilyMember
        join: ApplicationTypeForFamilyMember.Oid = Application.ApplicationTypeForFamilyMember
        role: lookup_fk_derive_type
      - schema: dbo
        table: Contract
        join: Contract.Oid = Application.Contract
        role: lookup_fk_project_contract
      - schema: dbo
        table: BorderZoneForVisa
        join: BorderZoneForVisa.Oid = Application.BorderZoneForVisa
        role: lookup_fk_bit_matrix
      - schema: dbo
        table: PersonInApplication
        join: PersonInApplication.Application = Application.Oid
        role: child_collection
        notes: ApplicationItem discovery — out of header import scope
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Application.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Application.yaml
    status: mapped
    notes: |
      12,237 active Application rows on Çalik VISA2015 (8,392 simple + 3,845 long process).
      Numbering on IRegistration_Data; 862 duplicate ManualApplicationNumber groups.
      Contract FK on all long-process rows; ProjectContract via calik-energi identityPassThrough.
      PersonInApplication: 21,794 active rows (40,414 total) → ApplicationItem after Application id-map.

  - id: application-item-main
    legacy:
      schema: dbo
      table: PersonInApplication
      boClass: IPersonInApplication
      boPath: VISA2014.Module/DC/IPersonInApplication.cs
    target:
      odataEntity: ApplicationItem
      boPath: Visa2026.Module/BusinessObjects/ApplicationItem.cs
    relationship: child_of_application
    legacyTablesExtra:
      - schema: dbo
        table: TravelInformation
        join: TravelInformation.Oid IN (PersonInApplication.EmployeeEntryDate, PersonInApplication.FamilyMemberEntryDate)
        role: registration_travel_flattened
      - schema: dbo
        table: AddressOnBusinessTrip
        join: AddressOnBusinessTrip.Oid = PersonInApplication.AddressOnBusinessTrip
        role: business_trip_line_address
      - schema: dbo
        table: WorkPermit
        join: WorkPermit.Oid = PersonInApplication.WorkPermit
        role: fk_current_work_permit
      - schema: dbo
        table: WorkPermitLocation
        join: WorkPermitLocation.Oid = WorkPermit.WorkPermitLocation
        role: bit_matrix_work_permitted_locations
      - schema: dbo
        table: Application
        join: Application.Oid = PersonInApplication.Application
        role: parent_header
      - schema: dbo
        table: BorderZoneForVisa
        join: BorderZoneForVisa.Oid = Application.BorderZoneForVisa
        role: header_bit_matrix_border_zone_on_line
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/ApplicationItem.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/ApplicationItem.yaml
    status: mapped
    notes: |
      21,794 active PersonInApplication rows on Çalik VISA2015 (12,210 parent applications).
      Person = Employee (employee apps) or FamilyMember (family apps); 2,759 FM lines also store Employee FK.
      Upsert/id-map on legacy Oid. Dedupe 925 (Application+Person) groups before POST.
      Requires Application + Person + Passport + Visa id-maps; WorkPermitItem id-map for CurrentWorkPermitItem (legacy WorkPermit.Oid).

  - id: rejection-header
    legacy:
      schema: dbo
      table: ApplicationResult
      boClass: IApplicationResult
      boPath: VISA2014.Module/DC/IApplicationResult.cs
      filter: Result = 1 (ApplicationResultEnum.Rejection)
    target:
      odataEntity: Rejection
      boPath: Visa2026.Module/BusinessObjects/Rejection.cs
    relationship: child_of_application
    legacyTablesExtra:
      - schema: dbo
        table: PersonInInvitation
        join: PersonInInvitation.Invitation = ApplicationResult.Oid AND PersonInInvitation.GCRecord IS NULL
        role: child_collection
        notes: RejectionItem discovery — out of header import scope
      - schema: dbo
        table: Application
        join: Application.Oid = ApplicationResult.Application
        role: parent_header
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Rejection.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Rejection.yaml
    status: mapped
    notes: |
      207 active ApplicationResult rows with Result=1 on Çalik VISA2015 (185 with items, 22 orphans).
      Split from Invitation (Result=0). id-map ApplicationResult.Oid → Rejection.ID (separate file from Invitation).
      Application FK required. Number → RejectedDocNumber; IssuedDate → Date. Reason allow_null.
      Duplicate Numbers: 2 groups — oid-tail suffix. File wave: CopyOfResult / NetijeGocurme → RejectionDocument.

  - id: rejection-item
    legacy:
      schema: dbo
      table: PersonInInvitation
      boClass: IPersonInResult
      boPath: VISA2014.Module/DC/IPersonInResult.cs
      filter: parent ApplicationResult.Result = 1
    target:
      odataEntity: RejectionItem
      boPath: Visa2026.Module/BusinessObjects/RejectionItem.cs
    relationship: child_of_rejection
    legacyTablesExtra:
      - schema: dbo
        table: ApplicationResult
        join: ApplicationResult.Oid = PersonInInvitation.Invitation AND ApplicationResult.Result = 1
        role: parent_header
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/RejectionItem.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/RejectionItem.yaml
    status: mapped
    notes: |
      254 active PersonInInvitation rows under Result=1 parents on Çalik VISA2015.
      Person = COALESCE(Employee, FamilyMember); Passport required; parent FK column still named Invitation.
      id-map PersonInInvitation.Oid → RejectionItem.ID. Import after Rejection + ApplicationItem.

  - id: application-progress-synthetic
    legacy:
      schema: dbo
      table: Application
      boClass: IApplication
      boPath: VISA2014.Module/DC/IApplication.cs
    target:
      odataEntity: ApplicationProgress
      boPath: Visa2026.Module/BusinessObjects/ApplicationProgress.cs
    relationship: synthetic_child_of_application
    legacyTablesExtra:
      - schema: dbo
        table: IRegistration_Data
        join: IRegistration_Data.Oid = Application.IRegistration_Data
        role: application_date_for_prepare_step
      - schema: dbo
        table: SimpleProcessApplication
        join: SimpleProcessApplication.Oid = Application.Oid
        role: direct_route_template
      - schema: dbo
        table: LongProcessApplication
        join: LongProcessApplication.Oid = Application.Oid
        role: ministry_route_template
      - schema: dbo
        table: Contract
        join: Contract.Oid = Application.Contract
        role: ministry_leg_count_hint
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/ApplicationProgress.yaml
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/ApplicationProgress.yaml
    status: mapped
    notes: |
      No legacy progress table — synthesize 1–N ApplicationProgress rows per Application from header scalars.
      Simple process (8,392): office → migration service. Long process (3,845): up to 5 steps incl. ministry + optional construction leg.
      Requires Application id-map. Skip parents blocked/skipped at header import (E:44/E:55).
