# Cross-BO index of property gaps and dedupe posture.
# Detail lives in each field-maps/{Entity}.yaml — update when a dossier closes.

version: 1

entities:
  - targetODataEntity: Person
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Person.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Oid
      - PersonalNumber
    duplicateGroups: 5
    legacyOnlyCount: 12
    targetOnlyCount: 4
    mismatchCount: 2
    importBlocked: false
    notes: |
      PersonalNumber from Passport; Visa2026 unique except "0". Merge 5 real-PN duplicate person pairs.
      Upsert on legacy Oid — not PersonalNumber alone.

  - targetODataEntity: Visa
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Visa.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Oid
      - VisaNumber
    duplicateGroups: 7
    legacyOnlyCount: 11
    targetOnlyCount: 8
    mismatchCount: 2
    importBlocked: false
    notes: |
      Passport FK via Passport id-map. Sentinel VisaNumber AFV0000000 / JLV0000000 (8 rows each).
      Layer-3 lookup audits pending before importConfirmed.

  - targetODataEntity: Education
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Education.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Oid
    duplicateGroups: 0
    legacyOnlyCount: 4
    targetOnlyCount: 2
    mismatchCount: 1
    importBlocked: false
    notes: |
      Person FK via Person id-map. GraduationYear derived from EducationEndDate year only.
      Import done 2026-06-26 (2958 posted).

  - targetODataEntity: EmployeePositionHistory
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/EmployeePositionHistory.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Oid
    duplicateGroups: 0
    legacyOnlyCount: 6
    targetOnlyCount: 2
    mismatchCount: 2
    importBlocked: true
    notes: |
      Legacy Employee FK → Person id-map. EndDate derived from next StartDate per Person.
      ActualPosition mirrors Position title (Visa2026-only). Position + Department tenant catalog seeds pending.

  - targetODataEntity: MedicalRecord
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/MedicalRecord.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - legacyCopyOid
    duplicateGroups: 0
    legacyOnlyCount: 3
    targetOnlyCount: 1
    mismatchCount: 4
    importBlocked: false
    notes: |
      File-only legacy path (SpidKepilnama → Copy → FileData). Synthesize scalars at import:
      DocumentNumber "0", IssueDate from audit ObjectCreated, ValidityDuration Month3.
      Çalik backup: 0 importable blobs. importConfirmed 2026-06-29 — file importer not implemented.

  - targetODataEntity: Application
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/Application.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Oid
    duplicateGroups: 862
    legacyOnlyCount: 38
    targetOnlyCount: 22
    mismatchCount: 8
    importBlocked: false
    notes: |
      Header dbo.Application + IRegistration_Data numbering. IsManualEntry=true for all legacy rows.
      ApplicationType composite layer 3 — E:44/E:55 approved skip_row 2026-06-29 (105 headers / 204 items).
      ProjectContract via calik-energi overlay. Progress/ministry scalars deferred to ApplicationProgress.

  - targetODataEntity: ApplicationItem
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/ApplicationItem.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - Application
      - Person
    duplicateGroups: 925
    legacyOnlyCount: 28
    targetOnlyCount: 18
    mismatchCount: 12
    importBlocked: false
    notes: |
      Legacy PersonInApplication → ApplicationItem. Upsert on Oid; dedupe (Application+Person) before POST.
      Person column rule: Employee vs FamilyMember by parent Application category.
      CurrentWorkPermitItem uses WorkPermitItem id-map (legacy WorkPermit.Oid). PurposeOfTravel + CheckPoint layer 3 drafted.
      204 item rows on parent ApplicationType E:44/E:55 skip with parent (approved skip_row 2026-06-29).

  - targetODataEntity: ApplicationProgress
    fieldMap: Visa2026.DataImporter/legacy/visa2014/field-maps/ApplicationProgress.yaml
    deduplicationEnabled: true
    dedupeKeys:
      - _syntheticStepKey
    duplicateGroups: 0
    legacyOnlyCount: 8
    targetOnlyCount: 1
    mismatchCount: 3
    importBlocked: false
    notes: |
      Synthetic child of Application — synthesize State/Location/Date from legacy ministry/process columns.
      MinistryLetterFile deferred. Initializer + transition validation conflicts documented in discovery dossier.

