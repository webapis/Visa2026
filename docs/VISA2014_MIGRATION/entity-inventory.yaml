# VISA2014 → Visa2026 entity inventory
# Summary index — sync when each dossier closes.
# Discovery/import order: Visa2026.DataImporter/legacy/visa2014/order.yaml

version: 1
legacy:
  product: VISA2014
  database: VISA2015               # source of truth for legacy schema and data
  repo: VISA2014                   # supplementary — BO/EF hints only
target:
  product: Visa2026
  importTransport: OData

entities:
  - targetODataEntity: Person
    discoveryDossier: discovery/Person.yaml
    tableMappingId: person-main
    discoveryStatus: complete
    importConfirmed: true
    importStatus: done
    legacyTable: Person
    legacyBo: Person
    blockReason: null
    notes: "Full import 2026-06-26: 2915 posted, 9 PN collisions; id-map 3087; 2925 People in LocalDB."

  - targetODataEntity: Passport
    discoveryDossier: discovery/Passport.yaml
    tableMappingId: passport-main
    discoveryStatus: complete
    importConfirmed: false
    importStatus: pending
    legacyTable: Passport
    legacyBo: Passport
    blockReason: null
    notes: "3684 active rows; dependsOn Person id-map. PassportType layer-3 approved 2026-06-26."

  - targetODataEntity: Application
    discoveryDossier: discovery/Application.yaml
    discoveryStatus: not_started
    importConfirmed: false
    importStatus: pending
    legacyTable: null
    legacyBo: null
    blockReason: null
    notes: "dependsOn Person — discover only after Person dossier complete (Person discovery complete 2026-06-20)."

  - targetODataEntity: ApplicationItem
    discoveryDossier: discovery/ApplicationItem.yaml
    discoveryStatus: not_started
    importConfirmed: false
    importStatus: pending
    legacyTable: null
    legacyBo: null
    blockReason: null
    notes: "dependsOn Person + Application — see order.yaml."
