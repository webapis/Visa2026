# Address-based MigrationService inference — App_Reg_Check_In with null DepartmentForRegistration
# Machine-readable rules for preview export and (after human approval) second-pass PATCH.
# Catalog target: Visa2026.Module/DatabaseUpdate/LookupCatalogs/migration-service.json

version: 1
approvedForPatch: true

scope:
  legacySource: calik-energi
  applicationType: App_Reg_Check_In
  applicationTypeComposites:
    - E:2:na:na:na
    - F:2:na:na:na
  legacyDepartmentForRegistration: null
  notes: |
    Only imported Check_In applications where legacy DepartmentForRegistration FK was null.
    Does not apply to other application types or rows that already had a department code.

addressSelection:
  path: Application → PersonInApplication → Person → AddressOfResidence → Region/City
  asOf: Application.ApplicationDate
  algorithm: PersonCurrentItems.GetCurrentAddressOfResidence
  notes: |
    Prefer address still valid on ApplicationDate (no expiration or expiration on/after that date);
    among valid rows, latest expiration then newest ID. If none valid, fall back to latest expired address (confidence downgrade).

confidence:
  high: Branch city override matched by cityMgCode (or cityNameContains when mgCode null).
  medium: Regional office from regionMgCode only, or regional mapping with non-branch city present.
  low: Regional mapping using expired-only address fallback, or cityNameContains without mgCode.
  none: No person, no address, null/empty region, or unknown region.

