services:
  app:
    image: webapia/visa2026:latest
    ports:
      - "80:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - DEVEXPRESS_LICENSEKEY=${DEVEXPRESS_LICENSEKEY}
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__DevExpress=Information
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-updater:
    profiles:
      - tools
    image: webapia/visa2026-importer:latest
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      - API_BASE_URL=http://app:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - TargetUrl=http://app:8080
    depends_on:
      - app

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-visa2026}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${DB_NAME:-visa2026}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: