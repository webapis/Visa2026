services:
  app:
    image: webapia/visa2026:${APP_IMAGE_TAG:-latest}
    ports:
      - "${APP_PORT:-80}:8080"
    volumes:
      - app_dataprotection_keys_prod:/home/app/.aspnet/DataProtection-Keys
    environment:
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026_prod};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - DEVEXPRESS_LICENSEKEY=${DEVEXPRESS_LICENSEKEY}
      - FORCE_XAF_DB_UPDATE=${FORCE_XAF_DB_UPDATE:-}
      - ASPNETCORE_ENVIRONMENT=Production
      - Logging__LogLevel__Default=Information
      - Logging__LogLevel__Microsoft=Warning
      - Logging__LogLevel__DevExpress=Information
    depends_on:
      postgres:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  db-updater:
    profiles:
      - tools
    image: webapia/visa2026-importer:${IMPORTER_IMAGE_TAG:-latest}
    environment:
      - PG_PASSWORD=${PG_PASSWORD}
      - ASPNETCORE_ENVIRONMENT=Production
      - API_BASE_URL=http://app:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${DB_NAME:-visa2026_prod};Username=${PG_USER:-postgres};Password=${PG_PASSWORD};Persist Security Info=True;EFCoreProvider=Postgres
      - TargetUrl=http://app:8080
    depends_on:
      - app

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=${PG_USER:-postgres}
      - POSTGRES_PASSWORD=${PG_PASSWORD}
      - POSTGRES_DB=${DB_NAME:-visa2026_prod}
    ports:
      - "127.0.0.1:${PG_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${DB_NAME:-visa2026_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data_prod:
  app_dataprotection_keys_prod: