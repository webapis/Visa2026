# VISA2014 → Visa2026 — import strategy status (machine-readable gate)
#
# Canonical narrative: docs/VISA2014_MIGRATION/IMPORT_PLAN_AND_STRATEGY.md
#
# Rules:
#   - status MUST be approved before ANY --import-visa2014 implementation or OData load.
#   - Per-BO importConfirmed is still required after strategy is approved.
#   - Update this file when strategic decisions in the plan change.

version: 1

status: approved                 # draft | review | approved
approvedAt: 2026-06-21
approvedBy: developer sign-off (chat)

implementationBlocked: false     # set false only when status: approved

strategy:
  legacyDatabase: VISA2015
  defaultLegacySource: calik-energi
  legacySqlAuth:
    user: ReadOnlyUser
    passwordEnv: VISA2014_SQL_PASSWORD
  multiCompany:
    model: one_legacy_db_per_deployment
    canonicalArtifact: Visa2026.DataImporter/legacy/visa2014/legacy-sources.yaml
    doc: docs/VISA2014_MIGRATION/MULTI_COMPANY_LEGACY_SOURCES.md
    sources:
      - id: calik-energi
        legacyDatabase: VISA2015
        targetTenant: Çalik Enerji (tenant JSON seed)
        notes: SQL database may be named VISA2015 on SQLEXPRESS; use ReadOnlyUser + VISA2014_SQL_PASSWORD
      - id: gap-insaat
        legacyDatabase: VISA2015
        targetTenant: Gap İnşaat (future deployment)
  legacySourceOfTruth: sql         # sql | repo — always sql for this project
  targetWritePath: OData
  importer: Visa2026.DataImporter
  cliFlag: --import-visa2014
  mappingArtifacts: yaml
  legacyGuidPolicy: id-map         # do not reuse legacy GUIDs as Visa2026 ID
  lookupPolicy: translate_only     # never import legacy lookup tables; use Visa2026 seed + lookup-translations*.yaml
  # Intentional row skips (not failures): docs/VISA2014_MIGRATION/import-exclusions.yaml — must be status:approved
  intentionalExclusionsRegistry: docs/VISA2014_MIGRATION/import-exclusions.yaml
  dedupePolicy: before_post
  firstTargetDatabase: Visa2026DbDev
  attachmentsWave: last
  fileImageImport:
    canonicalDoc: docs/VISA2014_MIGRATION/FILE_AND_IMAGE_IMPORT.md
    excelPreviewExcludesBinary: true     # stub audit columns only (_hasPhoto, length, hash)
    personPhotoFollowUp: after_scalar_person   # Person OData first → Photo PATCH
    plannedCliFlags:
      - --import-visa2014-files
      - --skip-file-properties              # scalar pass omits bytes
  excelPreview:
    enabled: true
    cliFlag: --export-visa2014-preview
    outputDir: Visa2026.DataImporter/legacy/visa2014/preview-export
    requiredBeforeImportConfirmed: true   # reviewer should open xlsx before sign-off
    usesSameTransformAsImport: true
  # 2026-09-07: optional during development only — sample import + human comparison
  pilotThenHumanVerify:
    lockedAt: 2026-09-07
    lockedBy: developer (chat)
    canonicalDoc: docs/VISA2014_MIGRATION/MAPPING_VERIFICATION.md
    when: development_mapping_check
    notRequiredFor: [onprem_demo_full_import, onprem_prod_full_import]
    appliesTo: local_dev_when_reviewer_asks
    defaultSampleRows: 1
    sampleRowsCli: --max-rows
    reviewerMayRaiseSample: true   # chat: compare 2 / compare 5 / compare N
    humanReview: required_when_enabled
    remainderOnlyAfterAccept: true
    compare:
      properties: mapped_field_map_only
      presentation: markdown_table_per_sample_row
      columns:
        - field          # human label (not raw YAML key only)
        - legacy         # VISA2015 value as stored / display
        - imported       # Visa2026 value as stored / display
        - result         # Match | Not match | Expected difference
      resultValues: [Match, Not match, Expected difference]
      identityHeader: true   # BO name, legacy Oid, target ID above each table
      lookupDisplay: human_label_not_guid
      emptyDisplay: (empty)
      highlightMismatches: bold_Not_match_row
      doNotDump: [raw_json, five_column_expected_transform_grid]
      haltUntil: accept_or_suggested_mapping_change
    permanentFixIn:
      - field-maps
      - lookup-translations
      - importer-csharp
    doNot:
      - patch_only_the_sample_rows_in_target_db
      - require_this_gate_on_every_bo_in_full_chains
    afterAccept: import remainder of that BO (no --max-rows; sample rows already imported)
  # 2026-09-04: Application Profile Instances import by ApplicationType slice
  # (not all headers, then all issued BOs). Living list:
  # Visa2026.DataImporter/legacy/visa2014/application-type-import-order.yaml
  applicationTypeSlices:
    canonicalArtifact: Visa2026.DataImporter/legacy/visa2014/application-type-import-order.yaml
    lockedAt: 2026-09-04
    visaRemainderAndLinkPinLockedAt: 2026-09-08
    sliceShape: per_type_full_inner_sequence
    firstType: App_Inv
    visaNeverBeforeIssuingInstance: true
    rosterInvitationTypesMustNotRequireVisa: true
    neverVisaRemainderOnTypeSlice: true
    localPgWipeVisaBeforePerTypeVisa: true
    rejectionAndBorderZoneDocuments: after_all_type_slices
    orphanVisaRemainderWave: after_all_type_slices
    applicationPersonDocumentLinkCorrection: immediately_after_orphan_visa_remainder
    historicalApplicationSnapshot:
      lockedAt: 2026-09-08
      rule: past_not_today
      why: All VISA2014 rows are historical. Import must not attach PersonCurrentItems / latest-N as of the import day.
      rosterResolvedLinks: person_in_application_snapshot
      snapshotKinds: [Passport, PreviousPassport, Visa, WorkPermitItem]
      snapshotKindsWhenProfileRequires:
        Education: RequirePersonEducation
        Position: RequirePersonPosition
        AddressOfResidence: RequirePersonAddressOfResidence
        TravelHistory: RequirePersonTravelHistory
      skipLatestNDuringDataImport: true
      pinAtRosterImport: true
      pinCorrectionAlsoWorkPermitItem: true
      pinRequiredEducationPositionAddressAtRosterAndCorrection: true
      pinRequiredTravelHistoryAtRosterAndCorrection: true
      officerRelinkMayUseToday: true
      missingIdMap: leave_unlinked_until_oid_in_map_then_pin
    piaVisaResolvedLinkMismatch:
      duringTypeSlice: expected_only_when_source_oid_not_in_id_map
      neverBecauseLatestN: true
      afterOrphanRemainder: pin_with_document_link_correction
      optionalPinAfterTypeVisaWave: true
    notes: |
      Per type Visa: --entity Visa --application-type <Name> only (no --visa-remainder).
      After ALL types: Rejection, BorderZone documents, then
      --entity Visa --visa-remainder (no type filter), then
      --correct-visa2014-application-person-document-links.
      Do not run --visa-remainder before later types' headers if first POST
      must set IssuingApplicationProfileInstance.
    applicationTypeProfileLock:
      canonicalArtifact: Visa2026.DataImporter/legacy/visa2014/application-type-profile-lock.yaml
      lockedAt: 2026-09-04
      rule: >
        Resolve ApplicationProfile from locked target ApplicationType.Name
        (and VISA2014 source composite), never from ApplicationType.Code.
        App_Inv_FM -> get_invitation_fm / Çakylyk Almak FM, not Çakylyk Almak.
    additionalWpLocationMovementPermitFromWorkPermit: true
    additionalWpLocationMovementPermitFromWorkPermitNotes: >
      App_Additional_WP_location header import: if Application.GoşmaçaIşlemägeRugsatÝeri
      is empty, set MovementPermitLocation from the majority linked
      PersonInApplication.WorkPermit.WorkPermitLocation bit flags (WorkPermittedLocationName).
      Do not overwrite a non-empty header. Re-import of this type also backfills empty
      already-imported instances. CLI: --correct-visa2014-movement-permit-location.
    bands:
      - produce-invitation              # invitation (+ WP with invitation) then visa; App_Inv first
      - produce-visa-workpermit-borderzone
      - change-invitation-or-visa       # still run issued Invitation/Visa steps
      - no-issued-documents             # last; includes cancel types

waves:
  - id: prerequisites
    importPhase: prerequisites
    status: not_started
  - id: person-domain
    importPhase: person-domain
    status: not_started
    pilotEntity: Person
    notes: >
      Includes TravelHistory after AddressOfResidence (order.yaml). Grain is
      PersonInApplication joined to TravelInformation; CLI --entity TravelHistory.
      Pin via SQL roster backfill on Registration ActionFamily only
      (--travel-roster-backfill-only). Do not walk all PersonInApplication rows.
  - id: application-domain
    importPhase: application-domain
    status: not_started
    notes: Per ApplicationType slice (application-type-import-order.yaml). App_Inv first.
  - id: permits-and-visas
    importPhase: permits-and-visas
    status: not_started
    notes: >
      In-slice Invitation/WP/Visa (no --visa-remainder on type slices).
      After all types: Rejection + BorderZone documents + --visa-remainder
      + --correct-visa2014-application-person-document-links.
  - id: progress-and-history
    importPhase: progress-and-history
    status: not_started
    notes: Progress is inside each type slice (after roster, before issued).
  - id: attachments
    importPhase: attachments
    status: not_started
    notes: |
      Locked 2026-09-07 (developer chat): Person.Photo → PassportDocument → VisaDocument
      → EducationDocument → MedicalRecordDocument → WorkPermitDocument →
      InvitationDocument → FamilyProofDocument. Unwired: RejectionDocument,
      BorderZoneDocument. Local PG transactional wipe 2026-09-07; re-run after
      scalars with pilotThenHumanVerify.

onPremDeployment:
  doc: docs/VISA2014_MIGRATION/ON_PREM_IIS_MIGRATION_RUNBOOK.md
  legacySqlHost: 10.100.128.15
  legacyDatabase: VISA2015
  visa2026Host: 10.100.128.25
  slots:
    production:
      port: 80
      database: Visa2026DbProd
      idMapDir: id-maps/calik-energi-onprem-prod
      legacySourceId: calik-energi-onprem-prod
    staging:
      port: 8080
      database: Visa2026DbStaging
      idMapDir: id-maps/calik-energi-onprem-staging
      legacySourceId: calik-energi-onprem-staging
    demo:
      port: 8081
      database: Visa2026DbDemo
      idMapDir: id-maps/calik-energi-onprem-demo
      legacySourceId: calik-energi-onprem-demo
  parallelPeriod:
    legacySystemOfRecord: true
    visa2026OfficerWrites: false          # view/search only until cutover
    catchUpPath: import_only              # OnPrem-Sync.ps1 / --import-visa2014 (delta Sync removed)
    conflictPolicy: legacy_wins
    scheduledDeltaSyncStatus: removed     # --sync-visa2014 / nightly Sync / LegacySyncDashboard deleted
    recommendedCatchUp:
      production: manual_import_as_needed
      staging: restore_from_prod_bak
      demo: manual_import_or_clone

openDecisions:
  - id: odata-service-account
    question: Service account for OData import
    decision: null
  - id: staging-database
    question: Staging DB for full-wave UAT
    decision: Visa2026DbStaging on 10.100.128.25:8080 (IIS slot)
    decidedAt: 2026-06-21
  - id: cutover-mode
    question: Big-bang vs domain waves on prod
    decision: null
  - id: parallel-period-officer-writes
    question: Officers write in Visa2026 before cutover?
    decision: false — read-only preview; legacy on 10.100.128.15 is system of record
    decidedAt: 2026-06-21
  - id: unmapped-lookup-policy
    question: Default unmappedPolicy for required lookups
    decision: null
  - id: file-blob-strategy
    question: How to load legacy blobs into Visa2026 (OData base64 vs stream vs staged files vs FileData two-step)
    decision: null
    options:
      - id: odata-base64
        label: OData JSON base64 PATCH (Person.Photo; small/medium blobs)
      - id: odata-stream
        label: OData property $value / stream upload
      - id: staged-files
        label: Batch copy to Visa2026 file store + OData metadata reference
      - id: filedata-two-step
        label: POST FileData then link on DocumentBase / child *Document
    recommendation: |
      Person.Photo → odata-base64 (fallback odata-stream if size limits hit).
      PassportCopy / *Document → filedata-two-step.
      Staged-files optional for prod volume after staging UAT.
    doc: docs/VISA2014_MIGRATION/FILE_AND_IMAGE_IMPORT.md
