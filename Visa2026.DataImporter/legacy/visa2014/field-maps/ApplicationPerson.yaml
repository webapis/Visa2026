# ApplicationProfileInstancePerson — Wave 2b thin roster from PersonInApplication
targetODataEntity: ApplicationProfileInstancePerson
legacyTable: dbo.PersonInApplication

fields:
  - source: PersonInApplication.Oid
    target: _legacyRowId
    notes: Id-map key (same as historic ApplicationItem map).

  - source: PersonInApplication.Application
    target: ApplicationProfileInstance
    required: true
    resolve: ApplicationProfileInstance id-map

  - source: PersonInApplication.Employee / FamilyMember
    target: Person
    required: true
    notes: |
      ForEmployee → Employee; ForFamilyMember → FamilyMember.
      Same derivation as ApplicationItem.

  - source: Application.ApplicationDate
    target: LinkedAt
    notes: Prefer application date; else LinkPerson default (DateTime.Now).

  - source: (derived)
    target: ResolvedLinks
    notes: |
      RefreshResolvedLinks fills Education/Address/etc. Passport and Visa are then
      replaced from PersonInApplication.Passport + PreviousPassport + Visa (id-map).
      Do not keep latest-N person documents on historical cases.
      A PIA.Visa vs latest-N mismatch is expected until the source Visa Oid is
      in the Visa id-map. Required after all types: --visa-remainder then
      --correct-visa2014-application-person-document-links. Optional after a
      type Visa wave. Never --visa-remainder on --application-type.
      When the instance Application Profile requires Education, Position, or
      AddressOfResidence, pin those kinds from PIA.Position / PIA.AddressOfResidence
      / PIA.Address (id-map) or the person's imported current row. Do not skip
      that pin because IsDataImport disables RefreshResolvedLinks.
      TravelHistory is a person child imported from the same PIA row (join
      TravelInformation). Pin when RequirePersonTravelHistory.

  - source: PersonInApplication.Passport
    target: ResolvedLinks.Passport (current)
    resolve: Passport id-map

  - source: PersonInApplication.PreviousPassport
    target: ResolvedLinks.Passport (previous)
    resolve: Passport id-map
    gatedBy: ApplicationType.ShowPreviousPassport

  - source: PersonInApplication.Visa
    target: ResolvedLinks.Visa (current)
    resolve: Visa id-map
    gatedBy: ApplicationType.ShowCurrentVisa

skip:
  - parent ApplicationType composites E:44 / E:55 (skip_row)
  - dedupe_duplicate (Application+Person, keep lowest Oid)

outOfScope:
  - CurrentPassport / CurrentVisa scalars (live on ResolvedLinks, not ApplicationProfileInstancePerson columns)
  - ApplicationItem cancel/issue flags (legacy ApplicationItem wave only)