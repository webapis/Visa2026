# Invitation field map — layer 2
# Layer 1: table-mappings.yaml (id: invitation-header)

tableMappingId: invitation-header

source:
  table: ApplicationResult
  schema: dbo
  filter: Result = 0 (Invitation) AND referenced by PersonInInvitation.Invitation FK

target:
  odataEntity: Invitation

deduplication:
  enabled: true
  keys:
    - InvitationNumber
  invitationNumberSuffix:
    when: duplicate Number across headers
    transform: append_legacy_oid_tail
    notes: 13 groups on Çalik — suffix last 8 hex chars of legacy ApplicationResult Oid

propertyGaps:
  targetOnly:
    - property: ShowOptionalFields
      disposition: omit_from_post
    - property: IsVisaStartAndEndDateDefined
      disposition: default_false
      notes: Legacy visa start/end window columns not mapped yet; leave false
    - property: VisaStartDate
      disposition: omit_from_post
    - property: VisaEndDate
      disposition: omit_from_post
    - property: DaysRemaining
      disposition: derived_on_save

fields:
  - source: ApplicationResult.Oid
    target: null
    transform: legacy_id
    notes: id-map key

  - source: ApplicationResult.Number
    target: InvitationNumber
    transform: identity_trim
    missingBehavior: skip_row

  - source: ApplicationResult.IssuedDate
    target: IssuedDate
    transform: date
    missingBehavior: skip_row
    notes: Formalization date (Resmileşdirilen sene). Stored in DB column StartDate.

  - source: ApplicationResult.DateOfExpire
    target: ExpirationDate
    transform: date
    missingBehavior: skip_row
    notes: Invitation letter expiry (Möhleti tamamlanýan sene)

  - source: ApplicationResult.DateOfExpire
    target: VisaPeriod
    transform: closest_day_span_to_visa_period
    candidates: [90, 180, 365]
    lookupCatalog: VisaPeriod
    missingBehavior: use_default
    notes: >
      Best-effort until legacy ApplicationResult VisaPeriod column is confirmed.
      Maps invitation letter span (IssuedDate→DateOfExpire) to Month3/Month6/Year1.

  - source: null
    target: VisaCategory
    transform: default_lookup
    lookupCatalog: VisaCategory
    missingBehavior: use_default
    notes: Default VisaCategory until legacy category column is mapped (Netije not used)

  - source: ApplicationResult.Application
    target: ApplicationProfileInstance
    transform: fk_id_map
    idMapEntity: ApplicationProfileInstance
    missingBehavior: allow_null