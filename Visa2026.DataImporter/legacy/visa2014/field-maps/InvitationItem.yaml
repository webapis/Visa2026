# InvitationItem field map — layer 2
# Layer 1: table-mappings.yaml (id: invitation-item)

tableMappingId: invitation-item

source:
  table: PersonInInvitation
  schema: dbo
  filter: parent ApplicationResult.Result = 0 (Invitation only; Result = 1 → RejectionItem)

target:
  odataEntity: InvitationItem

deduplication:
  enabled: false
  notes: 1:1 legacy PersonInInvitation row per Invitation parent

fields:
  - source: Oid
    target: null
    transform: legacy_id
    notes: id-map legacy PersonInInvitation.Oid → InvitationItem.ID

  - source: COALESCE(Employee, FamilyMember)
    target: Person
    transform: fk_id_map
    idMapEntity: Person
    missingBehavior: skip_row

  - source: Passport
    target: Passport
    transform: fk_id_map
    idMapEntity: Passport
    missingBehavior: skip_row

  - source: Invitation
    target: Invitation
    transform: fk_id_map
    idMapEntity: Invitation
    idMapLegacyTable: ApplicationResult
    missingBehavior: skip_row

  - source: PersonInApplication.Cancelled
    target: null
    transform: none
    notes: |
      InvitationItem no longer has IsCancelled / IsChanged / IsUsed.
      Cancelled/changed is derived at runtime via IssuedDocumentLifecycle
      (PROCESS_ISSUED Cancellation/Change skip-nav). Used = Visa.IssuingInvitationItem.