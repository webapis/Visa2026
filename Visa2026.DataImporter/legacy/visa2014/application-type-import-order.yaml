# VISA2014 -> Visa2026 -- Application Type import order (living list)
#
# Nested import for Application Profile Instances (via-ministry headers) and
# interdependent issued BOs. Do not invent types beyond what is listed.
# Append the next ApplicationType.Name when that type is locked.
#
# Walk: person-domain (no Visa) -> for each type in bands[] -> innerSequence
# -> after ALL types: postAllTypeSlices (Rejection, BorderZone documents,
#    --visa-remainder, then --correct-visa2014-application-person-document-links)
# -> attachments.
# Never pass --visa-remainder on a per-type Visa step.
# Optional local-dev mapping check: import-strategy.yaml pilotThenHumanVerify.
#
# Canonical narrative: docs/VISA2014_MIGRATION/IMPORT_PLAN_AND_STRATEGY.md
# BO topology (dependsOn): order.yaml
# Agent skill: .cursor/skills/visa2014-to-visa2026-import/SKILL.md
#
# Profile template lock (source composite -> target ApplicationType.Name ->
# ApplicationProfile Code/Name): application-type-profile-lock.yaml
# Do not infer ApplicationProfile from ApplicationType.Code (shared get_invitation).

version: 1
lockedAt: 2026-09-05
lockedBy: developer (chat)

sliceShape: per_type_full_inner_sequence
# For each type: run the full inner sequence, then the next type.
# Not: all types' headers, then all rosters.

visaNeverBeforeIssuingInstance: true
# Visa.IssuingApplicationProfileInstance requires the instance row first.
# Do not import Visa after Passport as a person-domain wave.

neverVisaRemainderOnTypeSlice: true
# --visa-remainder also POSTs visas whose issuing instance is not in the
# id-map yet (later types) with a null IssuingApplicationProfileInstance.
# Type-slice Visa: --entity Visa --application-type <Name> only.

rosterInvitationTypesMustNotRequireVisa: true
# Types that produce invitation must not require Visa on roster create
# (ResolvedLinks / RequirePerson*). Visa is imported later in the same slice
# when that instance issued a visa.

localPg:
  wipeVisaBeforePerTypeVisa: true
  notes: |
    Local PG already imported Visa before instances (legacy order).
    Wipe Visa (+ VisaDocument as needed) and reimport per type when that
    type reaches the visa inner step. Do not wipe during strategy-doc-only edits.

innerSequence:
  - id: header
    entity: ApplicationProfileInstance
    required: true
  - id: roster
    entity: ApplicationProfileInstancePerson
    required: true
  - id: progress
    entity: ApplicationProfileInstanceProgress
    required: true
  - id: issued-invitation
    entities:
      - Invitation
      - InvitationItem
    when: type_generates_invitation
  - id: issued-work-permit
    entities:
      - WorkPermit
      - WorkPermitItem
    when: type_generates_work_permit
  - id: visa
    entity: Visa
    when: instance_generates_visa
    notes: |
      After Invitation (+ items) when the type produces invitation.
      Still import visas whose IssuingApplicationProfileInstance is this case.
      Skip this step when the type/instance does not generate Visa.
      Do NOT pass --visa-remainder here.
      Roster ResolvedLinks.Visa is PersonInApplication.Visa (source), not the
      sticker this type issued. A PIA.Visa mismatch vs latest-N is expected
      until that Oid is in the Visa id-map (earlier type Visa wave, or
      postAllTypeSlices remainder + document-link correction). Optional after
      this step: --correct-visa2014-application-person-document-links (pins
      source visas already imported). Required pin is after visa-remainder.

# Dual-issue types (invitation AND work permit): Invitation header+items,
# then WorkPermit header+items, then Visa. Skip a branch when the type
# does not generate that document.

postAllTypeSlices:
  - id: rejection
    entities:
      - Rejection
      - RejectionItem
    notes: |
      This wipe 2026-09-08 remainder complete. Headers **207**, items **254**,
      Failed **0**, FK null **0**. Next: BorderZone documents sample.
  - id: border-zone-documents
    entities:
      - BorderZone
    notes: |
      This wipe 2026-09-08 remainder complete. Headers **110**, items **209**,
      Failed **0**. Item skip 3 Passport id-map misses (same as 2026-09-07).
      Next: --visa-remainder then document-link pin.
  - id: visa-remainder
    entity: Visa
    when: no_issuing_instance
    cli: --import-visa2014 --entity Visa --visa-remainder
    lockedAt: 2026-09-08
    notes: |
      After ALL type-slice Visa waves (and Rejection + BorderZone documents).
      No --application-type. Posts visas with no resolvable issuing instance
      (deleted Application/PIA, e.g. source stickers on GCRecord apps) and any
      leftover whose issuing instance is still not in the id-map.
      Local PG 2026-09-07 RunId 20260907-102109: Posted **609** (remainder **607**,
      leftover with issuing **2**), Failed **0**, already **5709**, no Passport map **25**.
      Local PG 2026-09-08 mid-band: Posted **574** then document-link pin (later
      type Visa waves skipped those Oids). This wipe after all types: Posted **0**,
      already **6328**, no Passport map **25**. Next: document-link pin.
  - id: application-person-document-links
    cli: --correct-visa2014-application-person-document-links
    lockedAt: 2026-09-08
    after: visa-remainder
    notes: |
      Pins PIA Passport/Visa/WorkPermitItem. Also pins Education, Position,
      AddressOfResidence when RequirePerson* is on. TravelHistory: Registration
      ActionFamily SQL backfill only (--travel-roster-backfill-only); do not walk
      all PersonInApplication (checkpoint/date/travel FKs exist only on Registration).
      This wipe 2026-09-08 after visa remainder: Passport **0**, Visa **2**,
      WorkPermitItem **2**; already **22262**. EPA 2026-09-09. Travel pin 2026-09-09:
      **7222** Registration missing pairs.

