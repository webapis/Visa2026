# Source identity is the lookup-translations ApplicationType composite key
# ({E|F}:{subtype}:{invWp}:{wizaWp}:{changeInfo}). Target name is Visa2026
# ApplicationType.Name. Profile name is the tenant template (Çakylyk Almak FM, …).
