importPhases:
  - id: prerequisites
    description: Target lookups seeded by Module updaters; tenantCatalogGeneration (project-contract + approval-leg-profile JSON from VISA2015); lookup-translations.yaml validated; lookup-review-queue personWaveComplete for Person
  - id: person-domain
    description: Person and person-scoped children (Passport yes; Visa is NOT in this phase)
  - id: application-domain
    description: Per ApplicationType slice — instance header, roster, in-slice issued Invitation/WorkPermit (see application-type-import-order.yaml)
  - id: permits-and-visas
    description: In-slice Invitation/WorkPermit/Visa; after all types — Rejection, BorderZone documents, orphan Visa remainder
  - id: progress-and-history
    description: ApplicationProfileInstanceProgress inside each type slice (after roster, before issued documents)
  - id: attachments
    description: File blobs and scan links

# Headless SQL corrections after application-domain waves (staging / full chain).
# Idempotent on greenfield imports. Required when re-importing into a DB that was loaded before a fix shipped.
postImportCorrections:
  runAfterImportPhase: application-domain
  requiresInProcessTarget: true
  skipWhenDryRun: true
  orchestration:
    - scripts/visa2014-migration/import/OnPrem-Staging.ps1
    - scripts/visa2014-migration/import/Run-HeadlessChain.ps1
  steps:
    - id: person-subcontractor
      cliFlag: --correct-person-subcontractor
      dependsOn:
        - Person
    - id: person-relationship
      cliFlag: --correct-person-relationship
      dependsOn:
        - Person
    - id: person-address-of-residence-pia
      cliFlag: --correct-person-address-of-residence
      dependsOn:
        - AddressOfResidence
        - ApplicationProfileInstancePerson
      notes: |
        Greenfield: PIA inference runs inside --import-visa2014 --entity AddressOfResidence (no extra step).
        This correction backfills Person rows on DBs imported earlier.
        ApplicationItem.CurrentAddressOfResidence backfill is retired (Phase B); roster links use ResolvedLinks.
    - id: visa-type
      cliFlag: --correct-visa-type
      dependsOn:
        - Visa
        - Person
      notes: |
        Rematches Visa.VisaType from transform: family-member persons → FM; else TypeOfVisaL:mgCode.
        Also repairs older imports that collapsed to default WP (LocalizationKey missing on DTOs).
    - id: visa-invitation-item
      cliFlag: --correct-visa2014-invitation-item
      dependsOn:
        - Visa
        - ApplicationProfileInstance
        - InvitationItem
      notes: |
        Path B hybrid: after IssuingApplicationProfileInstance is set, closest-match InvitationItem under that
        application (same person, unused/not cancelled, IssuedDate before Visa.IssueDate).
        Sets InvitationItem.IsUsed. Skips when issuing type lacks CanIssueInvitation. Leave null on no match.
        Run after the type-slice Visa step (not after a Passport-first Visa wave).
        --correct-application-item-person-current and --correct-visa2014-issuing-application-item are retired
        (Phase B ApplicationItem hard-remove).
