# VISA2014 → Visa2026 — canonical dependency order
#
# Single source of truth for:
#   - Phase 1 discovery (walk `entities` top-to-bottom, respect dependsOn)
#   - Phase 4+ import topology (dependsOn). Execution of application-domain is NOT a
#     flat walk of this list — see application-type-import-order.yaml.
#
# Application Profile Instance import (locked 2026-09-04):
#   Person-domain first (Passport yes, Visa NO).
#   Then one ApplicationType at a time (living list in application-type-import-order.yaml):
#     header → roster → progress → issued Invitation/WorkPermit (if type generates) → Visa (if instance generates)
#   Then next type. After ALL types: Rejection + BorderZone documents + orphan Visa remainder.
#   Never import Visa before its IssuingApplicationProfileInstance.
#
# Rules:
#   - Array order MUST be a topological sort: every dependsOn target appears earlier in the list.
#   - Discover/import one BO atomically; only one discoveryStatus: in_progress at a time.
#   - Do not discover a BO until all dependsOn are complete | blocked | skip.
#   - Do not implement import code or run OData load until importConfirmed: true (Phase 1b sign-off).
#   - Lookup review gate: personWaveComplete in lookup-comparisons/lookup-review-queue.yaml before Person importConfirmed.
#   - ApplicationProfileInstance importConfirmed requires applicationWaveComplete in the same queue.
#   - If a dependency is blocked, downstream BOs stay not_started unless waived in mapping.notes.
#   - IMPORT CHAIN GATE: never start the next inner step / type until the previous wave
#     succeeds (process exit 0 AND FailedCount = 0). Children depend on parent id-maps /
#     rows from earlier BOs. Omitting a parent BO (e.g. InvitationItem before Visa on
#     invitation-producing types) is a chain bug — fix the orchestrator step list.
#
# When adding a BO: insert at the correct dependency position (not at the end unless it is a leaf).
# Living ApplicationType order: Visa2026.DataImporter/legacy/visa2014/application-type-import-order.yaml

