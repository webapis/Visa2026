# VISA2014 → Visa2026 — canonical dependency order
#
# Single source of truth for:
#   - Phase 1 discovery (walk `entities` top-to-bottom, respect dependsOn)
#   - Phase 4+ OData import (same sequence)
#
# Rules:
#   - Array order MUST be a topological sort: every dependsOn target appears earlier in the list.
#   - Discover/import one BO atomically; only one discoveryStatus: in_progress at a time.
#   - Do not discover a BO until all dependsOn are complete | blocked | skip.
#   - Do not implement import code or run OData load until importConfirmed: true (Phase 1b sign-off).
#   - Lookup review gate: personWaveComplete in lookup-comparisons/lookup-review-queue.yaml before Person importConfirmed.
#   - Application importConfirmed requires applicationWaveComplete in the same queue.
#   - If a dependency is blocked, downstream BOs stay not_started unless waived in mapping.notes.
#
# When adding a BO: insert at the correct dependency position (not at the end unless it is a leaf).

version: 1

bootstrapOnce:
  - id: global-schema-index
    description: Table list + row counts; identify XAF/system tables to skip
    artifact: docs/VISA2014_MIGRATION/schema-snapshot.md
    status: complete
    completedAt: 2026-06-20

entities:
  # --- person-domain (no upstream transactional deps) ---
  - targetODataEntity: Person
    dependsOn: []
    importPhase: person-domain
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Person.yaml
    discoveryStatus: complete
    legacySource: calik-energi
    importConfirmed: true
    importConfirmedAt: 2026-06-26
    importConfirmedBy: developer
    importStatus: done
    notes: |
      Full OData import 2026-06-26: 2915/2924 posted, 9 failed (duplicate PersonalNumber collisions).
      Id-map 3087 entries after alias expand. Target People: 2925 rows (GCRecord=0).

  - targetODataEntity: Passport
    dependsOn:
      - Person
    importPhase: person-domain
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Passport.yaml
    discoveryStatus: complete
    legacySource: calik-energi
    importConfirmed: false
    importConfirmedAt: null
    importConfirmedBy: null
    importStatus: pending
    notes: |
      Discovery complete 2026-06-26 (3684 rows, PassportType approved).
      Blocked on full Person id-map + Passport preview review before importConfirmed.

  # - targetODataEntity: Education
  #   dependsOn: [Person]
  #   importPhase: person-domain
  #   discoveryDossier: docs/VISA2014_MIGRATION/discovery/Education.yaml
  #   discoveryStatus: not_started
  #   importStatus: pending

  # --- application-domain ---
  - targetODataEntity: Application
    dependsOn:
      - Person
    importPhase: application-domain
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/Application.yaml
    discoveryStatus: not_started
    importConfirmed: false
    importConfirmedAt: null
    importConfirmedBy: null
    importStatus: pending

  - targetODataEntity: ApplicationItem
    dependsOn:
      - Person
      - Application
    importPhase: application-domain
    discoveryDossier: docs/VISA2014_MIGRATION/discovery/ApplicationItem.yaml
    discoveryStatus: not_started
    importConfirmed: false
    importConfirmedAt: null
    importConfirmedBy: null
    importStatus: pending

  # --- permits-and-visas (after application-domain) ---
  # - targetODataEntity: Invitation
  #   dependsOn: [Application]
  #   importPhase: permits-and-visas
  #   ...

  # --- progress-and-history ---
  # - targetODataEntity: ApplicationProgress
  #   dependsOn: [Application]
  #   importPhase: progress-and-history
  #   ...

  # --- attachments (last) ---
  # File blobs / scan links — often separate pipeline; discover after owning BOs.

importPhases:
  - id: prerequisites
    description: Target lookups seeded by Module updaters; lookup-translations.yaml validated; lookup-review-queue personWaveComplete for Person
  - id: person-domain
    description: Person and person-scoped children
  - id: application-domain
    description: Application header and items
  - id: permits-and-visas
    description: Invitation, WorkPermit, Visa, BorderZone, Rejection
  - id: progress-and-history
    description: ApplicationProgress and legacy state history
  - id: attachments
    description: File blobs and scan links
