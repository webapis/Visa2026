# Native XAF EasyTest E2E (Visa2026.E2E.Tests) - Windows + PostgreSQL + Edge.
#
# Where this runs (see docs/TESTING_PLAN.md section 6):
#   Unit tests must be green before the Windows E2E job starts.
#     push / pull_request -> wait for "Build & unit tests" on the same commit
#     schedule / workflow_dispatch -> dispatch that workflow, then wait (do not uses: it)
#   pull_request / push to master -> Tier 0 only (officer journey), strict, no retry
#   nightly schedule + manual run -> full suite, hang dumps, one retry for flaky browser steps
#
# PUBLIC REPO: artifacts below (screen recording, host logs, trx) are downloadable by
# anyone. Keep E2ETestDataSeed synthetic - no real personal or passport data.

name: EasyTest E2E

# Automatic E2E is paused (push / PR / nightly). Run from Actions when needed.
on:
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional dotnet test --filter expression (empty = employee slices)"
        required: false
        default: ""
      max_parallel:
        description: Maximum parallel employee E2E jobs (1–4). Default 4.
        required: false
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'

concurrency:
  group: easytest-e2e-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a nightly or manual long run; only supersede PR gate runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PG_PASSWORD: Visa2026Local
  PG_USER: postgres
  PG_HOST: localhost
  PG_PORT: "5432"

jobs:
  # Never `uses:` build-and-test.yml — that inlines every unit-test job into this graph.
  # Push/PR: wait for the concurrent "Build & unit tests" run. Nightly/manual: dispatch it, then wait.
  unit-tests-gate:
    name: Wait for unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: write
    steps:
      - name: Require Build & unit tests success
        uses: actions/github-script@v7
        with:
          script: |
            // pull_request: context.sha is the merge commit; unit-test workflow runs on the PR head.
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const workflowName = 'Build & unit tests';
            const deadline = Date.now() + 30 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
            const shouldDispatch =
              context.eventName === 'schedule' || context.eventName === 'workflow_dispatch';

            async function findRun() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                per_page: 20,
              });
              const matches = runs.filter((r) => r.name === workflowName);
              if (matches.length === 0) return null;
              const active = matches.find((r) => r.status !== 'completed');
              if (active) return active;
              return matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            }

            if (shouldDispatch && !(await findRun())) {
              const ref = context.ref.replace(/^refs\/heads\//, '');
              core.info(`Dispatching "${workflowName}" on ${ref} (${sha})`);
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'build-and-test.yml',
                ref,
              });
            }

            let run = await findRun();
            while (!run || run.status !== 'completed') {
              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for "${workflowName}" on ${sha}`);
                return;
              }
              core.info(run
                ? `"${workflowName}" status=${run.status} — waiting…`
                : `"${workflowName}" not found yet for ${sha} — waiting…`);
              await sleep(15000);
              run = await findRun();
            }

            core.info(`"${workflowName}" conclusion=${run.conclusion} url=${run.html_url}`);
            if (run.conclusion !== 'success') {
              core.setFailed(`E2E blocked: "${workflowName}" concluded ${run.conclusion}`);
            }

  # Parallel Playwright employee slices (each job has its own :5050 + Postgres).
  # fail-fast: false so Sign in / Register / Find / Add passport show as separate checks.
  easytest-e2e:
    name: E2E — ${{ matrix.name }}
    needs: [unit-tests-gate]
    if: >-
      always() &&
      needs.unit-tests-gate.result == 'success' &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.test_filter == '')
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # workflow_dispatch input, else repo variable E2E_MAX_PARALLEL, else 4.
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || vars.E2E_MAX_PARALLEL || '4') }}
      matrix:
        include:
          - slice: signin
            name: Sign in
            filter: PersonOfficerJourney_SignIn_Local
            trx: e2e-signin.trx
          - slice: register
            name: Register employee
            filter: PersonOfficerJourney_RegisterEmployee_Local
            trx: e2e-register.trx
          - slice: find
            name: Find employee
            filter: PersonOfficerJourney_FindEmployee_Local
            trx: e2e-find.trx
          - slice: passport
            name: Add passport
            filter: PersonOfficerJourney_LoginCreateEmployeeAddPassport_Local
            trx: e2e-passport.trx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: E2E Windows setup
        uses: ./.github/actions/visa2026-e2e-windows-setup
        with:
          devexpress-license: ${{ secrets.DEVEXPRESS_LICENSE }}
          devexpress-key: ${{ secrets.DEVEXPRESS_KEY }}

      - name: Start screen recording
        if: >-
          matrix.slice == 'passport' &&
          (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push')
        continue-on-error: true
        shell: pwsh
        run: |
          $recDir = Join-Path $env:GITHUB_WORKSPACE "Visa2026.E2E.Tests\recordings"
          New-Item -ItemType Directory -Force -Path $recDir | Out-Null
          $out = Join-Path $recDir "officer-journey.mp4"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "ffmpeg not found; installing via choco."
            choco install ffmpeg -y --no-progress | Out-Null
          }
          $ffArgs = @(
            '-y','-f','gdigrab','-framerate','10','-draw_mouse','1','-i','desktop',
            '-movflags','frag_keyframe+empty_moov','-pix_fmt','yuv420p',$out
          )
          $proc = Start-Process -FilePath 'ffmpeg' -ArgumentList $ffArgs -PassThru -WindowStyle Hidden
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'ffmpeg.pid') -Value $proc.Id
          Write-Host "Started ffmpeg (pid $($proc.Id)) recording to $out"

      - name: Run slice
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          VISA2026_E2E_SNAPSHOT_TRUST: 'true'
          LONG_RUN: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}
          SLICE_FILTER: ${{ matrix.filter }}
          TRX_NAME: ${{ matrix.trx }}
        run: |
          $blame = @{}
          if ($env:LONG_RUN -eq 'true') { $blame.BlameHang = $true }
          & .\scripts\ci\Run-PlaywrightE2eSlice.ps1 -Filter $env:SLICE_FILTER -TrxName $env:TRX_NAME @blame
          if ($LASTEXITCODE -ne 0) { throw "Slice '$env:SLICE_FILTER' failed with exit $LASTEXITCODE" }

      - name: Stop screen recording
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'ffmpeg.pid'
          if (Test-Path $pidFile) {
            $ffPid = (Get-Content $pidFile | Select-Object -First 1).Trim()
            Write-Host "Stopping ffmpeg (pid $ffPid)."
            try { Stop-Process -Id $ffPid -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 4
          }

      - name: Upload E2E recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-recording-${{ matrix.slice }}
          path: "**/recordings/*.mp4"
          if-no-files-found: ignore

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-screenshots-${{ matrix.slice }}
          path: "**/recordings/screenshots/**"
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-results-${{ matrix.slice }}
          path: |
            **/e2e-signin.trx
            **/e2e-register.trx
            **/e2e-find.trx
            **/e2e-passport.trx
            **/*.dmp
          if-no-files-found: ignore

      - name: Upload EasyTest host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-host-logs-${{ matrix.slice }}
          path: "**/easytest-host-logs/**"
          if-no-files-found: ignore

  easytest-e2e-legacy:
    name: E2E — EasyTest (legacy)
    needs: [unit-tests-gate]
    if: >-
      always() &&
      needs.unit-tests-gate.result == 'success' &&
      (github.event_name == 'schedule' || github.event_name == 'push') &&
      (github.event_name != 'workflow_dispatch' || github.event.inputs.test_filter == '')
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: E2E Windows setup
        uses: ./.github/actions/visa2026-e2e-windows-setup
        with:
          devexpress-license: ${{ secrets.DEVEXPRESS_LICENSE }}
          devexpress-key: ${{ secrets.DEVEXPRESS_KEY }}

      - name: Run EasyTest (legacy)
        id: e2e_legacy
        continue-on-error: true
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          VISA2026_E2E_SNAPSHOT_TRUST: 'true'
        run: |
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--filter', 'FullyQualifiedName~PersonOfficerJourneyTests',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-legacy.trx',
            '--blame-hang', '--blame-hang-timeout', '10m'
          )
          Write-Host "dotnet $($testArgs -join ' ')"
          & dotnet @testArgs
          if ($LASTEXITCODE -ne 0) { throw "Legacy EasyTest failed with exit $LASTEXITCODE" }

      - name: Retry EasyTest (legacy)
        if: steps.e2e_legacy.outcome == 'failure'
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          VISA2026_E2E_SNAPSHOT_TRUST: 'true'
        run: |
          Write-Host "::warning::First legacy EasyTest attempt failed; retrying once."
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--filter', 'FullyQualifiedName~PersonOfficerJourneyTests',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-legacy-retry.trx',
            '--blame-hang', '--blame-hang-timeout', '10m'
          )
          & dotnet @testArgs
          if ($LASTEXITCODE -ne 0) { throw "Legacy EasyTest retry failed with exit $LASTEXITCODE" }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-results-legacy
          path: |
            **/e2e-legacy.trx
            **/e2e-legacy-retry.trx
            **/*.dmp
          if-no-files-found: ignore

  easytest-e2e-custom:
    name: EasyTest E2E (custom filter)
    needs: [unit-tests-gate]
    if: >-
      always() &&
      needs.unit-tests-gate.result == 'success' &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.test_filter != ''
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: E2E Windows setup
        uses: ./.github/actions/visa2026-e2e-windows-setup
        with:
          devexpress-license: ${{ secrets.DEVEXPRESS_LICENSE }}
          devexpress-key: ${{ secrets.DEVEXPRESS_KEY }}

      - name: Run EasyTest E2E suite
        id: e2e
        continue-on-error: true
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          VISA2026_E2E_SNAPSHOT_TRUST: 'true'
          TEST_FILTER: ${{ github.event.inputs.test_filter }}
        run: |
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-results.trx',
            '--blame-hang', '--blame-hang-timeout', '10m',
            '--filter', $env:TEST_FILTER
          )
          Write-Host "dotnet $($testArgs -join ' ')"
          & dotnet @testArgs

      - name: Retry EasyTest E2E suite
        id: e2e_retry
        if: steps.e2e.outcome == 'failure'
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          VISA2026_E2E_SNAPSHOT_TRUST: 'true'
          TEST_FILTER: ${{ github.event.inputs.test_filter }}
        run: |
          Write-Host "::warning::First E2E attempt failed; retrying once."
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-results-retry.trx',
            '--blame-hang', '--blame-hang-timeout', '10m',
            '--filter', $env:TEST_FILTER
          )
          & dotnet @testArgs

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-results-custom
          path: |
            **/e2e-results.trx
            **/e2e-results-retry.trx
            **/*.dmp
          if-no-files-found: ignore

      - name: Report flaky first attempt
        if: steps.e2e.outcome == 'failure' && steps.e2e_retry.outcome == 'success'
        shell: pwsh
        run: Write-Host "::warning::E2E passed only on retry - treat as flaky and record in .cursor/skills/visa2026-easytest-e2e/learnings.md"
