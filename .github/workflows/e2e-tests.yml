# Native XAF EasyTest E2E (Visa2026.E2E.Tests) - Windows + PostgreSQL + Edge.
#
# Where this runs (see docs/TESTING_PLAN.md section 6):
#   Unit tests must be green before the Windows E2E job starts.
#     push / pull_request -> wait for "Build & unit tests" on the same commit
#     schedule / workflow_dispatch -> run unit tests via workflow_call first
#   pull_request / push to master -> Tier 0 only (officer journey), strict, no retry
#   nightly schedule + manual run -> full suite, hang dumps, one retry for flaky browser steps
#
# PUBLIC REPO: artifacts below (screen recording, host logs, trx) are downloadable by
# anyone. Keep E2ETestDataSeed synthetic - no real personal or passport data.

name: EasyTest E2E

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # 20:00 UTC = 01:00 Ashgabat (UTC+5); results are ready before the workday.
    # GitHub cron is best-effort and can drift during peak hours.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      test_filter:
        description: "Optional dotnet test --filter expression (empty = full suite)"
        required: false
        default: ""

concurrency:
  group: easytest-e2e-${{ github.event_name }}-${{ github.ref }}
  # Never cancel a nightly or manual long run; only supersede PR gate runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  PG_PASSWORD: Visa2026Local
  PG_USER: postgres
  PG_HOST: localhost
  PG_PORT: "5432"

jobs:
  # Push/PR: "Build & unit tests" already runs for this event — wait; skip Windows if red.
  unit-tests-gate:
    name: Wait for unit tests
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
    steps:
      - name: Require Build & unit tests success
        uses: actions/github-script@v7
        with:
          script: |
            // PR merge commits use a different SHA than the PR head; wait on the head commit
            // so we observe the same Build & unit tests run that gated this PR.
            const sha = context.eventName === 'pull_request'
              ? context.payload.pull_request.head.sha
              : context.sha;
            const workflowName = 'Build & unit tests';
            const eventName = context.eventName;
            const deadline = Date.now() + 30 * 60 * 1000;
            const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

            async function findRun() {
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                head_sha: sha,
                event: eventName,
                per_page: 20,
              });
              const matches = runs.filter((r) => r.name === workflowName);
              if (matches.length === 0) return null;
              const active = matches.find((r) => r.status !== 'completed');
              if (active) return active;
              return matches.sort((a, b) => new Date(b.created_at) - new Date(a.created_at))[0];
            }

            let run = await findRun();
            while (!run || run.status !== 'completed') {
              if (Date.now() > deadline) {
                core.setFailed(`Timed out waiting for "${workflowName}" on ${sha}`);
                return;
              }
              core.info(run
                ? `"${workflowName}" status=${run.status} — waiting…`
                : `"${workflowName}" not found yet for ${sha} (${eventName}) — waiting…`);
              await sleep(15000);
              run = await findRun();
            }

            core.info(`"${workflowName}" conclusion=${run.conclusion} url=${run.html_url}`);
            if (run.conclusion !== 'success') {
              core.setFailed(`E2E blocked: "${workflowName}" concluded ${run.conclusion}`);
            }

  # Nightly / manual: no concurrent unit-test workflow for this event — run them here first.
  unit-tests:
    name: Build + unit tests
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit

  easytest-e2e:
    name: EasyTest E2E (Windows)
    needs: [unit-tests-gate, unit-tests]
    # One of the gates runs; the other is skipped. Do not start Windows unless a gate succeeded.
    if: >-
      always() &&
      (needs.unit-tests-gate.result == 'success' || needs.unit-tests-gate.result == 'skipped') &&
      (needs.unit-tests.result == 'success' || needs.unit-tests.result == 'skipped') &&
      (needs.unit-tests-gate.result == 'success' || needs.unit-tests.result == 'success')
    runs-on: windows-latest
    timeout-minutes: ${{ github.event_name == 'pull_request' && 45 || 180 }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Inputs arrive via env, never inlined into the script body (expression injection).
      - name: Resolve test scope
        id: scope
        shell: pwsh
        env:
          INPUT_FILTER: ${{ github.event.inputs.test_filter }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # Tier 0 on the PR gate keeps it fast; everything else runs the full suite.
          $filter = $env:INPUT_FILTER
          if ([string]::IsNullOrWhiteSpace($filter) -and $env:EVENT_NAME -eq 'pull_request') {
            $filter = 'FullyQualifiedName~PersonOfficerJourneyTests'
          }
          $long = $env:EVENT_NAME -in @('schedule', 'workflow_dispatch', 'push')
          "filter=$filter" | Out-File $env:GITHUB_OUTPUT -Append
          "long=$($long.ToString().ToLower())" | Out-File $env:GITHUB_OUTPUT -Append
          Write-Host "event=$($env:EVENT_NAME) filter='$filter' longRun=$long"

      - name: Write DevExpress license
        shell: pwsh
        env:
          DEVEXPRESS_LICENSE: ${{ secrets.DEVEXPRESS_LICENSE }}
          DEVEXPRESS_KEY: ${{ secrets.DEVEXPRESS_KEY }}
        run: |
          New-Item -ItemType Directory -Force -Path DevExpress.Key | Out-Null
          $license = $env:DEVEXPRESS_LICENSE
          if ([string]::IsNullOrWhiteSpace($license)) { $license = $env:DEVEXPRESS_KEY }
          if ([string]::IsNullOrWhiteSpace($license)) {
            throw "Set DEVEXPRESS_LICENSE or DEVEXPRESS_KEY in repository secrets."
          }
          Set-Content -Path DevExpress.Key/DevExpress_License.txt -Value $license.Trim() -Encoding utf8 -NoNewline

      # windows-latest ships PostgreSQL preinstalled (service disabled, postgres/root).
      # Reusing it instead of "choco install postgresql16" saves roughly 8 minutes per run;
      # the Chocolatey path stays as a fallback if the image ever drops the preinstall.
      - name: Start PostgreSQL
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Get-PgBin {
            $root = Get-ChildItem 'C:\Program Files\PostgreSQL' -Directory -ErrorAction SilentlyContinue |
              Sort-Object { [int]($_.Name -replace '\D', '0') } -Descending | Select-Object -First 1
            if ($root) { return (Join-Path $root.FullName 'bin') }
            return $null
          }

          $usedPreinstalled = $false
          $svc = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Select-Object -First 1
          $bin = Get-PgBin

          if ($svc -and $bin) {
            Write-Host "Found preinstalled PostgreSQL service '$($svc.Name)' with binaries at $bin"
            try {
              Set-Service -Name $svc.Name -StartupType Automatic
              if ((Get-Service $svc.Name).Status -ne 'Running') { Start-Service $svc.Name }
              $env:Path = "$bin;$env:Path"
              # Runner images use password 'root' for the postgres superuser; align it with PG_PASSWORD.
              $env:PGPASSWORD = 'root'
              & psql -h $env:PG_HOST -p $env:PG_PORT -U $env:PG_USER -d postgres `
                -c "ALTER USER $env:PG_USER WITH PASSWORD '$env:PG_PASSWORD';" 2>$null
              if ($LASTEXITCODE -ne 0) {
                # Password may already match what the tests expect.
                $env:PGPASSWORD = $env:PG_PASSWORD
                & psql -h $env:PG_HOST -p $env:PG_PORT -U $env:PG_USER -d postgres -c "SELECT 1;"
                if ($LASTEXITCODE -ne 0) { throw "Cannot authenticate against preinstalled PostgreSQL." }
              }
              $usedPreinstalled = $true
            } catch {
              Write-Host "::warning::Preinstalled PostgreSQL unusable ($($_.Exception.Message)); falling back to Chocolatey."
            }
          }

          if (-not $usedPreinstalled) {
            choco install postgresql16 --params "/Password:$env:PG_PASSWORD" -y --no-progress
            $bin = Get-PgBin
            if (-not $bin) { throw "PostgreSQL install directory not found." }
            $env:Path = "$bin;$env:Path"
            $svc = Get-Service -Name 'postgresql*' -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($svc -and $svc.Status -ne 'Running') { Start-Service $svc.Name }
          }

          Add-Content -Path $env:GITHUB_PATH -Value $bin
          $env:PGPASSWORD = $env:PG_PASSWORD
          & psql -h $env:PG_HOST -p $env:PG_PORT -U $env:PG_USER -d postgres -c "SELECT version();"
          if ($LASTEXITCODE -ne 0) { throw "PostgreSQL is not reachable with PG_PASSWORD." }

      - name: Install Microsoft Edge WebDriver
        shell: pwsh
        run: |
          $edgeExe = "${env:ProgramFiles(x86)}\Microsoft\Edge\Application\msedge.exe"
          if (-not (Test-Path $edgeExe)) {
            $edgeExe = "$env:ProgramFiles\Microsoft\Edge\Application\msedge.exe"
          }
          if (-not (Test-Path $edgeExe)) {
            throw "Microsoft Edge not found on the runner."
          }
          $edgeVersion = (Get-Item $edgeExe).VersionInfo.FileVersion
          Write-Host "Edge version: $edgeVersion"
          $driverDir = Join-Path $env:GITHUB_WORKSPACE "Visa2026.E2E.Tests\.webdrivers"
          New-Item -ItemType Directory -Force -Path $driverDir | Out-Null
          $zipPath = Join-Path $env:RUNNER_TEMP "edgedriver_win64.zip"
          $zipUrl = "https://msedgedriver.microsoft.com/$edgeVersion/edgedriver_win64.zip"
          Write-Host "Downloading: $zipUrl"
          Invoke-WebRequest -Uri $zipUrl -OutFile $zipPath -UseBasicParsing
          $extractRoot = Join-Path $env:RUNNER_TEMP "edgedriver_extract"
          if (Test-Path $extractRoot) { Remove-Item $extractRoot -Recurse -Force }
          Expand-Archive -LiteralPath $zipPath -DestinationPath $extractRoot -Force
          $driverExe = Get-ChildItem -Path $extractRoot -Recurse -Filter msedgedriver.exe | Select-Object -First 1
          if (-not $driverExe) { throw "msedgedriver.exe not found in downloaded zip." }
          Copy-Item -LiteralPath $driverExe.FullName -Destination (Join-Path $driverDir "msedgedriver.exe") -Force
          & (Join-Path $driverDir "msedgedriver.exe") --version

      - name: Restore
        shell: pwsh
        run: dotnet restore Visa2026.slnx

      - name: Build EasyTest configuration
        shell: pwsh
        run: dotnet build Visa2026.slnx -c EasyTest --no-restore

      # Record the headed-Edge desktop so the browser session is a downloadable video.
      # Fragmented MP4 (frag_keyframe+empty_moov) stays playable after a force-stop.
      # Long runs only - not worth the setup cost on the PR gate. Never fails the job.
      - name: Start screen recording
        if: steps.scope.outputs.long == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $recDir = Join-Path $env:GITHUB_WORKSPACE "Visa2026.E2E.Tests\recordings"
          New-Item -ItemType Directory -Force -Path $recDir | Out-Null
          $out = Join-Path $recDir "officer-journey.mp4"
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            Write-Host "ffmpeg not found; installing via choco."
            choco install ffmpeg -y --no-progress | Out-Null
          }
          $ffArgs = @(
            '-y','-f','gdigrab','-framerate','10','-draw_mouse','1','-i','desktop',
            '-movflags','frag_keyframe+empty_moov','-pix_fmt','yuv420p',$out
          )
          $proc = Start-Process -FilePath 'ffmpeg' -ArgumentList $ffArgs -PassThru -WindowStyle Hidden
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'ffmpeg.pid') -Value $proc.Id
          Write-Host "Started ffmpeg (pid $($proc.Id)) recording to $out"

      - name: Run EasyTest E2E suite
        id: e2e
        # Long runs tolerate a first failure so the retry below decides the verdict.
        continue-on-error: ${{ steps.scope.outputs.long == 'true' }}
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          TEST_FILTER: ${{ steps.scope.outputs.filter }}
          LONG_RUN: ${{ steps.scope.outputs.long }}
        run: |
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-results.trx'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
            $testArgs += @('--filter', $env:TEST_FILTER)
          }
          if ($env:LONG_RUN -eq 'true') {
            # Turn a hung browser session into a dump instead of eating the job timeout.
            $testArgs += @('--blame-hang', '--blame-hang-timeout', '10m')
          }
          Write-Host "dotnet $($testArgs -join ' ')"
          & dotnet @testArgs

      # One retry only, and only on long runs: a flaky Edge/session failure should not
      # mark the whole night red, but the PR gate stays strict.
      - name: Retry EasyTest E2E suite
        id: e2e_retry
        if: steps.scope.outputs.long == 'true' && steps.e2e.outcome == 'failure'
        shell: pwsh
        env:
          CI: true
          VISA2026_E2E_SCREENSHOTS: 'true'
          TEST_FILTER: ${{ steps.scope.outputs.filter }}
        run: |
          Write-Host "::warning::First E2E attempt failed; retrying once."
          $testArgs = @(
            'test', 'Visa2026.E2E.Tests/Visa2026.E2E.Tests.csproj',
            '-c', 'EasyTest', '--no-build',
            '--logger', 'console;verbosity=normal',
            '--logger', 'trx;LogFileName=e2e-results-retry.trx',
            '--blame-hang', '--blame-hang-timeout', '10m'
          )
          if (-not [string]::IsNullOrWhiteSpace($env:TEST_FILTER)) {
            $testArgs += @('--filter', $env:TEST_FILTER)
          }
          & dotnet @testArgs

      - name: Stop screen recording
        if: always() && steps.scope.outputs.long == 'true'
        continue-on-error: true
        shell: pwsh
        run: |
          $pidFile = Join-Path $env:RUNNER_TEMP 'ffmpeg.pid'
          if (Test-Path $pidFile) {
            $ffPid = (Get-Content $pidFile | Select-Object -First 1).Trim()
            Write-Host "Stopping ffmpeg (pid $ffPid)."
            try { Stop-Process -Id $ffPid -Force -ErrorAction SilentlyContinue } catch {}
            Start-Sleep -Seconds 4
          } else {
            Write-Host "No ffmpeg pid file found; recording may not have started."
          }

      - name: Upload E2E recording
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-recording
          path: "**/recordings/*.mp4"
          if-no-files-found: ignore

      - name: Upload E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-screenshots
          path: "**/recordings/screenshots/**"
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-e2e-results
          path: |
            **/e2e-results.trx
            **/e2e-results-retry.trx
            **/*.dmp
          if-no-files-found: ignore

      - name: Upload EasyTest host logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: easytest-host-logs
          path: "**/easytest-host-logs/**"
          if-no-files-found: ignore

      - name: Report flaky first attempt
        if: steps.e2e.outcome == 'failure' && steps.e2e_retry.outcome == 'success'
        shell: pwsh
        run: Write-Host "::warning::E2E passed only on retry - treat as flaky and record in .cursor/skills/visa2026-easytest-e2e/learnings.md"
