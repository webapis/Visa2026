# Build and push webapia/visa2026 (+ importer) to Docker Hub.
#
# When this runs:
#   Push to master, or workflow_dispatch (current HEAD).
#   Does not wait for EasyTest E2E or unit tests.
#   Push to Hub runs only after docker build succeeds (failed build skips push).

name: Build and Publish to Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: webapia/visa2026

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Resolve commit to publish
        id: ref
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Publishing commit $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Get Version from Project
        id: get_version
        run: |
          echo "APP_VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Visa2026.Module/Visa2026.Module.csproj)" >> $GITHUB_ENV

      - name: Build app Docker image
        env:
          PUBLISH_SHA: ${{ steps.ref.outputs.sha }}
          PUBLISH_SHA_SHORT: ${{ steps.ref.outputs.sha_short }}
        run: |
          docker build . \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} \
            --build-arg GIT_SHA=${PUBLISH_SHA_SHORT} \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${PUBLISH_SHA} \
            -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}

      - name: Push app Docker image
        env:
          PUBLISH_SHA: ${{ steps.ref.outputs.sha }}
        run: |
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${PUBLISH_SHA}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}

      - name: Build importer Docker image
        run: docker build -f Visa2026.DataImporter/Dockerfile . -t webapia/visa2026-importer:latest

      - name: Push importer Docker image
        run: docker push webapia/visa2026-importer:latest