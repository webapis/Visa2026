# Build and push webapia/visa2026 (+ importer) to Docker Hub.
#
# When this runs:
#   Push to master, or workflow_dispatch (current HEAD).
#   Does not wait for EasyTest E2E or unit tests.
#   App and importer build in parallel. Push runs only after that image builds.
#   Buildx GHA cache reuses apt + NuGet layers on later runs.

name: Build and Publish to Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: webapia/visa2026

jobs:
  publish-app:
    name: App image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Resolve commit to publish
        id: ref
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Publishing commit $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Get Version from Project
        id: get_version
        run: |
          echo "APP_VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Visa2026.Module/Visa2026.Module.csproj)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.ref.outputs.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_SHA=${{ steps.ref.outputs.sha_short }}
          cache-from: type=gha,scope=visa2026-app
          cache-to: type=gha,mode=max,scope=visa2026-app

  publish-importer:
    name: Importer image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push importer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Visa2026.DataImporter/Dockerfile
          push: true
          tags: webapia/visa2026-importer:latest
          cache-from: type=gha,scope=visa2026-importer
          cache-to: type=gha,mode=max,scope=visa2026-importer
