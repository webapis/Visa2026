# Build and push webapia/visa2026 (+ importer) to Docker Hub.
#
# When this runs:
#   After EasyTest E2E succeeds for a push to master (full suite).
#   E2E itself requires green unit tests, so publish does not re-check them.
#   workflow_dispatch -> manual republish of current default-branch HEAD (skips the gate).
# Does not publish after PR Tier 0 E2E, nightly schedule, or failed runs.

name: Build and Publish to Docker Hub

on:
  workflow_run:
    workflows: ["EasyTest E2E"]
    types: [completed]
    branches: [master]
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: webapia/visa2026

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Auto-publish only after a successful E2E run triggered by push to master.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    permissions:
      contents: read
      actions: read

    steps:
      - name: Resolve commit to publish
        id: ref
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA="${{ github.event.workflow_run.head_sha }}"
          else
            SHA="${{ github.sha }}"
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Publishing commit $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Get Version from Project
        id: get_version
        run: |
          echo "APP_VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Visa2026.Module/Visa2026.Module.csproj)" >> $GITHUB_ENV

      - name: Build and push app Docker image
        env:
          PUBLISH_SHA: ${{ steps.ref.outputs.sha }}
          PUBLISH_SHA_SHORT: ${{ steps.ref.outputs.sha_short }}
        run: |
          docker build . \
            --build-arg APP_VERSION=${{ env.APP_VERSION }} \
            --build-arg GIT_SHA=${PUBLISH_SHA_SHORT} \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${PUBLISH_SHA} \
            -t ${{ env.DOCKER_IMAGE_NAME }}:latest \
            -t ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${PUBLISH_SHA}
          docker push ${{ env.DOCKER_IMAGE_NAME }}:latest
          docker push ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}

      - name: Build and push importer Docker image
        run: |
          docker build -f Visa2026.DataImporter/Dockerfile . -t webapia/visa2026-importer:latest
          docker push webapia/visa2026-importer:latest