# Build and push webapia/visa2026 (+ importer) to Docker Hub.
#
# When this runs:
#   Push to master, or workflow_dispatch (current HEAD).
#   Does not wait for EasyTest E2E or unit tests.
#   App publishes every time. Importer only when DataImporter (or this workflow) changes.
#   Runtime base (apt/fonts/LibreOffice) rebuilds only when its Dockerfile/fonts change
#   (or workflow_dispatch rebuild_runtime_base=true). App FROMs webapia/visa2026-runtime-base:v1.
#   Buildx GHA + registry cache reuses layers on later runs.

name: Build and Publish to Docker Hub

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      rebuild_runtime_base:
        description: Force rebuild/push of visa2026-runtime-base:v1
        type: boolean
        default: false
      build_importer:
        description: Force build/push of importer image
        type: boolean
        default: false

env:
  DOCKER_IMAGE_NAME: webapia/visa2026
  RUNTIME_BASE_IMAGE: webapia/visa2026-runtime-base
  RUNTIME_BASE_TAG: v1

jobs:
  changes:
    name: Path filters
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      importer: ${{ steps.filter.outputs.importer }}
      runtime_base: ${{ steps.filter.outputs.runtime_base }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect path changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            importer:
              - 'Visa2026.DataImporter/**'
              - '.github/workflows/publish-to-docker-hub.yml'
            runtime_base:
              - 'docker/Dockerfile.runtime-base'
              - 'docker/fonts/**'
              - '.github/workflows/publish-to-docker-hub.yml'

  publish-runtime-base:
    name: Runtime base image
    needs: changes
    if: >-
      needs.changes.outputs.runtime_base == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.rebuild_runtime_base)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push runtime base
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime-base
          push: true
          tags: |
            ${{ env.RUNTIME_BASE_IMAGE }}:${{ env.RUNTIME_BASE_TAG }}
            ${{ env.RUNTIME_BASE_IMAGE }}:latest
          cache-from: |
            type=gha,scope=visa2026-runtime-base
            type=registry,ref=${{ env.RUNTIME_BASE_IMAGE }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=visa2026-runtime-base
            type=registry,ref=${{ env.RUNTIME_BASE_IMAGE }}:buildcache,mode=max

  publish-app:
    name: App image
    needs: [changes, publish-runtime-base]
    # Run when base succeeded or was skipped (existing Hub :v1 is used).
    if: >-
      always()
      && needs.changes.result == 'success'
      && (needs.publish-runtime-base.result == 'success'
          || needs.publish-runtime-base.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Resolve commit to publish
        id: ref
        shell: bash
        run: |
          SHA="${{ github.sha }}"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Publishing commit $SHA"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Get Version from Project
        id: get_version
        run: |
          echo "APP_VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Visa2026.Module/Visa2026.Module.csproj)" >> $GITHUB_ENV

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE_NAME }}:${{ steps.ref.outputs.sha }}
            ${{ env.DOCKER_IMAGE_NAME }}:latest
            ${{ env.DOCKER_IMAGE_NAME }}:${{ env.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            GIT_SHA=${{ steps.ref.outputs.sha_short }}
            RUNTIME_BASE_IMAGE=${{ env.RUNTIME_BASE_IMAGE }}:${{ env.RUNTIME_BASE_TAG }}
          cache-from: |
            type=gha,scope=visa2026-app
            type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache
          cache-to: |
            type=gha,mode=max,scope=visa2026-app
            type=registry,ref=${{ env.DOCKER_IMAGE_NAME }}:buildcache,mode=max

  publish-importer:
    name: Importer image
    needs: changes
    if: >-
      needs.changes.outputs.importer == 'true'
      || (github.event_name == 'workflow_dispatch' && inputs.build_importer)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Write DevExpress license key
        run: |
          mkdir -p DevExpress.Key
          echo "${{ secrets.DEVEXPRESS_KEY }}" > DevExpress.Key/DevExpress_License.txt

      - name: Write DevExpress license file
        run: echo "${{ secrets.DEVEXPRESS_LICENSE }}" > DevExpress.Key/DevExpress_License.txt

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push importer image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Visa2026.DataImporter/Dockerfile
          push: true
          tags: webapia/visa2026-importer:latest
          cache-from: |
            type=gha,scope=visa2026-importer
            type=registry,ref=webapia/visa2026-importer:buildcache
          cache-to: |
            type=gha,mode=max,scope=visa2026-importer
            type=registry,ref=webapia/visa2026-importer:buildcache,mode=max
