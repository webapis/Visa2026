# Fast gate: two parallel Debug builds (Module.Tests vs DataImporter), then unit-test slices.
# Does not build E2E.Tests or UserManual tools — those are not on this gate.
# No database, no browser. Browser coverage lives in e2e-tests.yml.

name: Build & unit tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      max_parallel:
        description: Maximum parallel unit-test jobs (1-4). Default 4.
        required: false
        type: choice
        options: ['1', '2', '3', '4']
        default: '4'
  # Called by EasyTest E2E for schedule / manual runs (no concurrent unit-test workflow).
  workflow_call:

concurrency:
  group: build-and-test-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  NUGET_XMLDOC_MODE: skip

jobs:
  build-module-tests:
    name: Build Module.Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Write DevExpress license
        shell: bash
        env:
          DEVEXPRESS_LICENSE: ${{ secrets.DEVEXPRESS_LICENSE }}
          DEVEXPRESS_KEY: ${{ secrets.DEVEXPRESS_KEY }}
        run: |
          license="${DEVEXPRESS_LICENSE:-$DEVEXPRESS_KEY}"
          if [ -z "$license" ]; then
            echo "::warning::No DevExpress license secret available (fork PR?); building with NoWarn."
            exit 0
          fi
          mkdir -p DevExpress.Key
          printf '%s' "$license" > DevExpress.Key/DevExpress_License.txt

      - name: Restore Module.Tests
        run: dotnet restore Visa2026.Module.Tests/Visa2026.Module.Tests.csproj

      # Module + tests only. No Blazor host, E2E, or UserManual tools.
      - name: Build Module.Tests
        run: >-
          dotnet build Visa2026.Module.Tests/Visa2026.Module.Tests.csproj
          -c Debug --no-restore -m
          -p:RunAnalyzersDuringBuild=false
          -p:EnforceCodeStyleInBuild=false
          "/p:NoWarn=DX1000%3BDX1001"

      - name: Upload Module.Tests bins
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-bins-module
          path: Visa2026.Module.Tests/bin/Debug
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  build-dataimporter:
    name: Build DataImporter
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Write DevExpress license
        shell: bash
        env:
          DEVEXPRESS_LICENSE: ${{ secrets.DEVEXPRESS_LICENSE }}
          DEVEXPRESS_KEY: ${{ secrets.DEVEXPRESS_KEY }}
        run: |
          license="${DEVEXPRESS_LICENSE:-$DEVEXPRESS_KEY}"
          if [ -z "$license" ]; then
            echo "::warning::No DevExpress license secret available (fork PR?); building with NoWarn."
            exit 0
          fi
          mkdir -p DevExpress.Key
          printf '%s' "$license" > DevExpress.Key/DevExpress_License.txt

      - name: Restore DataImporter
        run: dotnet restore Visa2026.DataImporter/Visa2026.DataImporter.csproj

      # Pulls Module + Blazor.Server (DataImporter references host migration types). Still skips E2E.
      - name: Build DataImporter
        run: >-
          dotnet build Visa2026.DataImporter/Visa2026.DataImporter.csproj
          -c Debug --no-restore -m
          -p:RunAnalyzersDuringBuild=false
          -p:EnforceCodeStyleInBuild=false
          "/p:NoWarn=DX1000%3BDX1001"

      - name: Upload DataImporter bins
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-bins-dataimporter
          path: Visa2026.DataImporter/bin/Debug
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  module-tests:
    name: Unit tests — ${{ matrix.name }}
    needs: build-module-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(github.event.inputs.max_parallel || vars.UNIT_TEST_MAX_PARALLEL || '4') }}
      matrix:
        include:
          - name: TemplateScan
            filter: FullyQualifiedName~Visa2026.Module.Tests.TemplateScan
            trx: module-templatescan.trx
          - name: TemplateConvert
            filter: FullyQualifiedName~Visa2026.Module.Tests.TemplateConvert
            trx: module-templateconvert.trx
          - name: Services
            filter: FullyQualifiedName~Visa2026.Module.Tests.Services
            trx: module-services.trx
          - name: Other
            filter: FullyQualifiedName!~Visa2026.Module.Tests.TemplateScan&FullyQualifiedName!~Visa2026.Module.Tests.TemplateConvert&FullyQualifiedName!~Visa2026.Module.Tests.Services
            trx: module-other.trx
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download Module.Tests bins
        uses: actions/download-artifact@v4
        with:
          name: unit-test-bins-module

      - name: Run slice
        run: >-
          dotnet test Visa2026.Module.Tests/Visa2026.Module.Tests.csproj
          -c Debug --no-restore --no-build
          --filter "${{ matrix.filter }}"
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=${{ matrix.trx }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.name }}
          path: "**/TestResults/${{ matrix.trx }}"
          if-no-files-found: ignore
          retention-days: 7

  dataimporter-tests:
    name: Unit tests — DataImporter
    needs: build-dataimporter
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download DataImporter bins
        uses: actions/download-artifact@v4
        with:
          name: unit-test-bins-dataimporter

      # Audit_* facts need legacy SQL / local Postgres; skip on a clean runner.
      - name: Run DataImporter tests
        run: >-
          dotnet test Visa2026.DataImporter/Visa2026.DataImporter.csproj
          -c Debug --no-restore --no-build
          --filter "FullyQualifiedName!~Audit_"
          --logger "console;verbosity=minimal"
          --logger "trx;LogFileName=dataimporter-tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-DataImporter
          path: "**/TestResults/dataimporter-tests.trx"
          if-no-files-found: ignore
          retention-days: 7

  # Keep this job name so branch-protection / E2E still see "Build + unit tests".
  unit-tests-ok:
    name: Build + unit tests
    needs: [build-module-tests, build-dataimporter, module-tests, dataimporter-tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require builds and every slice
        run: |
          if [ "${{ needs.build-module-tests.result }}" != "success" ]; then
            echo "Build Module.Tests failed (${{ needs.build-module-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.build-dataimporter.result }}" != "success" ]; then
            echo "Build DataImporter failed (${{ needs.build-dataimporter.result }})"
            exit 1
          fi
          if [ "${{ needs.module-tests.result }}" != "success" ]; then
            echo "A Module.Tests slice failed (${{ needs.module-tests.result }})"
            exit 1
          fi
          if [ "${{ needs.dataimporter-tests.result }}" != "success" ]; then
            echo "DataImporter tests failed (${{ needs.dataimporter-tests.result }})"
            exit 1
          fi