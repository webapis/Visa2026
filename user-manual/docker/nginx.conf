server {
    listen 80;
    server_name _;

    # Officer manual media (PNG/MP4) — versioned tree under manual-media/
    location /manual-media/ {
        alias /usr/share/nginx/html/manual-media/;
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # MkDocs static site (built with site_url ending in /manual/)
    location /manual/ {
        alias /usr/share/nginx/html/manual/;
        try_files $uri $uri/ /manual/index.html;
    }

    location = / {
        return 302 /manual/;
    }
}
